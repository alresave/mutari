<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mutari Login</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center">

<div class="w-full max-w-md bg-gray-900 p-8 rounded-xl shadow-xl">

<h1 class="text-3xl font-bold text-center mb-6">Mutari</h1>

<p class="text-gray-400 text-center mb-8">
Compatibility Engine
</p>

<div class="space-y-4">

<input
id="name"
placeholder="Name (signup only)"
class="w-full p-3 rounded bg-gray-800 border border-gray-700"
/>

<input
id="email"
placeholder="Email"
class="w-full p-3 rounded bg-gray-800 border border-gray-700"
/>

<input
id="password"
type="password"
placeholder="Password"
class="w-full p-3 rounded bg-gray-800 border border-gray-700"
/>

<button
onclick="signup()"
class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-semibold"
>
Sign Up
</button>

<button
onclick="login()"
class="w-full bg-green-600 hover:bg-green-700 p-3 rounded font-semibold"
>
Login
</button>

</div>

<p id="error" class="text-red-400 mt-4 text-center"></p>

</div>

<script>

async function signup() {

const name = document.getElementById("name").value
const email = document.getElementById("email").value
const password = document.getElementById("password").value

const res = await fetch("/auth/signup", {

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
name,
email,
password
})

})

const data = await res.json()

if(data.error){

document.getElementById("error").innerText=data.error
return

}

localStorage.setItem("token",data.token)
localStorage.setItem("user_id",data.user_id)

window.location.href="/app/index.html"

}

async function login(){

const email=document.getElementById("email").value
const password=document.getElementById("password").value

const res=await fetch("/auth/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email,
password
})

})

const data=await res.json()

if(data.error){

document.getElementById("error").innerText=data.error
return

}

localStorage.setItem("token",data.token)
localStorage.setItem("user_id",data.user.id)

if(data.profile_complete){

window.location.href="/app/matches.html"

}else{

window.location.href="/app/index.html"

}

}

</script>

</body>
</html>
