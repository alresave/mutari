<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutari - Create Team</title>
    <link rel="stylesheet" href="styles/output.css">
    <link rel="stylesheet" href="styles/site.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="page-create-team text-slate-200 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-lg">
        <a href="/app/company-hub.html" class="inline-flex items-center text-sm text-slate-400 hover:text-white mb-8">Back to dashboard</a>

        <div class="glass-card p-10 rounded-[2.5rem]">
            <h1 class="text-3xl font-black text-white">Create team</h1>
            <p class="text-slate-400 mt-2">This page stays available for old links, but the same action also exists inside the dashboard.</p>

            <form id="teamForm" class="space-y-5 mt-8">
                <input id="teamName" type="text" placeholder="Team name" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-indigo-500">
                <textarea id="teamDescription" placeholder="Team description" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-indigo-500 min-h-[160px]"></textarea>
                <div id="message" class="text-sm min-h-[1.25rem]"></div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white p-4 rounded-xl font-black">Create team</button>
            </form>
        </div>
    </div>

<script>
const API_URL = "http://localhost:8080";
const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "/app/login.html";
}

const headers = {
    "Content-Type": "application/json",
    "Authorization": "Bearer " + token
};

function setMessage(message, tone = "ok") {
    const element = document.getElementById("message");
    element.className = "text-sm min-h-[1.25rem] " + (tone === "error" ? "text-red-400" : "text-emerald-400");
    element.textContent = message;
}

document.getElementById("teamForm").addEventListener("submit", async event => {
    event.preventDefault();
    setMessage("");

    try {
        const response = await fetch(`${API_URL}/teams`, {
            method: "POST",
            headers,
            body: JSON.stringify({
                name: document.getElementById("teamName").value.trim(),
                description: document.getElementById("teamDescription").value.trim()
            })
        });

        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.error || "Could not create team");
        }

        localStorage.setItem("current_team_id", data.id);
        setMessage("Team created. Redirecting...");
        window.location.href = "/app/company-hub.html";
    } catch (error) {
        setMessage(error.message, "error");
    }
});
</script>
</body>
</html>
