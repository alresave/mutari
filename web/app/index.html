<!DOCTYPE html>

<html class="dark">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mutari — AI Team Intelligence</title>

<link rel="stylesheet" href="styles/output.css">
<link rel="stylesheet" href="styles/site.css">

</head>

<body class="page-index text-slate-200">

<div class="max-w-4xl mx-auto px-6 py-16">

  <!-- HERO -->

  <div class="text-center mb-10">

<img src="./images/logo.png" class="h-10 mx-auto mb-6 opacity-90">

<h1 class="text-3xl font-medium tracking-tight mb-3">
  Hire better teams with AI
</h1>

<p class="text-slate-500 text-sm mb-8">
  See who to hire — and why
</p>

<a href="#demo"
  class="bg-white text-black hover:bg-gray-200 px-5 py-2 rounded-md text-sm font-medium">
  Watch demo
</a>

  </div>

  <!-- HERO SCREENSHOT -->

  <div class="mb-14">

<div class="relative max-w-5xl mx-auto hero-wrap">

  <div class="absolute inset-0 blur-3xl opacity-40 hero-glow"></div>

  <img src="./images/dashboard.png"
    class="relative rounded-lg border border-slate-800 shadow-xl hero-shot">

</div>

  </div>

  <!-- DEMO -->

  <div id="demo" class="mb-14">

<p class="text-center text-slate-500 text-sm mb-6">
  Analyze a team and see the best hire instantly
</p>

<div class="landing-card overflow-hidden demo-frame">

  <div class="flex items-center gap-2 px-4 py-2 border-b border-slate-800">
    <div class="w-2.5 h-2.5 rounded-full bg-slate-600"></div>
    <div class="w-2.5 h-2.5 rounded-full bg-slate-600"></div>
    <div class="w-2.5 h-2.5 rounded-full bg-slate-600"></div>
  </div>

  <iframe
    src="./dashboard.html?demo=true"
    class="w-full h-[85vh] min-h-[850px]">
  </iframe>

</div>

  </div>

  <!-- VALUE -->

  <div class="text-center mb-14 max-w-md mx-auto">

<p class="text-slate-500 text-sm">
  Mutari analyzes your team, identifies gaps, and shows exactly
  which candidate will improve performance — with clear reasoning.
</p>

  </div>

  <!-- FOOTER -->

  <div class="text-center text-xs text-slate-700">
    Mutari
  </div>

</div>

<!-- 🔥 ALL JS IN ONE PLACE -->

<script>

// elements
const demo = document.querySelector(".demo-frame")
const shot = document.querySelector(".hero-shot")
const wrap = document.querySelector(".hero-wrap")
const glow = document.querySelector(".hero-glow")

// 🎬 reveal demo
new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      demo.classList.add("visible")
    }
  })
}).observe(demo)

// 🎬 reveal hero
new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      shot.classList.add("visible")
      shot.classList.add("float")
    }
  })
}).observe(shot)

// 🧲 mouse interaction
wrap.addEventListener("mousemove", (e) => {

  const rect = wrap.getBoundingClientRect()

  const x = (e.clientX - rect.left) / rect.width - 0.5
  const y = (e.clientY - rect.top) / rect.height - 0.5

  const rotateX = y * -6
  const rotateY = x * 8

  shot.style.transform = `
    rotateX(${rotateX}deg)
    rotateY(${rotateY}deg)
    scale(1.02)
  `

  glow.style.background = `
    radial-gradient(
      circle at ${e.clientX - rect.left}px ${e.clientY - rect.top}px,
      rgba(99,102,241,0.35),
      transparent 60%
    )
  `
})

// reset
wrap.addEventListener("mouseleave", () => {
  shot.style.transform = "rotateX(2deg) rotateY(0deg) scale(1)"
})

</script>

</body>
</html>
