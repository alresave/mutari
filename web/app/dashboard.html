<!DOCTYPE html>
<html class="dark">

<head>

<meta charset="UTF-8">
<title>Mutari — Team Intelligence</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-slate-950 text-slate-200 h-screen overflow-hidden">

<div class="flex h-screen">

<!-- LEFT PANEL -->
<div class="w-1/4 bg-slate-900 p-6 flex flex-col gap-6">

<img src="images/logo.png" class="w-[256px] mx-auto mb-6">

<div>

<div class="text-sm text-slate-400">
Team Archetype
</div>

<div id="teamArchetype" class="text-3xl font-bold mt-1">
—
</div>

</div>

<div>

<div class="text-sm text-slate-400">
Team Genome Balance
</div>

<div id="teamScore" class="text-4xl font-bold mt-1">
—
</div>

</div>

<div>

<div class="text-sm text-slate-400 mb-2">
Team
</div>

<select
id="teamSelector"
class="bg-slate-800 p-2 rounded w-full"
onchange="loadCandidates()"
>

<option value="1">Team Alpha</option>
<option value="2">Team Beta</option>

</select>

</div>

<button
onclick="showTeamGaps()"
class="bg-indigo-600 hover:bg-indigo-700 p-3 rounded mt-4"
>

Analyze Team Gaps

</button>

<div id="teamGaps" class="mt-4 text-sm"></div>

<div id="candidateImpact" class="mt-6 text-sm"></div>

</div>

<!-- CENTER PANEL -->
<div class="w-2/4 flex flex-col items-center justify-center">

<canvas id="radar" width="500" height="500"></canvas>

<div class="mt-8 text-center">

<div class="text-sm text-slate-400">
Candidate Score
</div>

<div id="candidateScore" class="text-5xl font-bold mt-2">
—
</div>

</div>

</div>

<!-- RIGHT PANEL -->
<div class="w-1/4 bg-slate-900 p-6 flex flex-col">

<div class="text-lg font-semibold mb-4">
Candidates
</div>

<div
id="candidateList"
class="flex flex-col gap-3 overflow-y-scroll"
>

</div>

</div>

</div>

<script>

const token = localStorage.getItem("token")

let radar

function initRadar(){

radar = new Chart(
document.getElementById("radar"),
{
type:"radar",
data:{
labels:[
"Core Values",
"Lifestyle Rhythm",
"Emotional Stability",
"Relational Architecture",
"Ambition",
"Growth",
"Intimacy",
"Cognitive Style"
],
datasets:[
{
label:"Team",
data:[0,0,0,0,0,0,0,0],
borderColor:"#6366f1",
backgroundColor:"rgba(99,102,241,0.2)"
},
{
label:"Candidate",
data:[0,0,0,0,0,0,0,0],
borderColor:"#22c55e",
backgroundColor:"rgba(34,197,94,0.2)"
}
]
},
options:{
scales:{
r:{
min:0,
max:100
}
}
}
})

}

async function loadCandidates(){

const team=document.getElementById("teamSelector").value

const res=await fetch(`/teams/${team}/matches`,{
headers:{Authorization:`Bearer ${token}`}
})

const data=await res.json()

const list=document.getElementById("candidateList")

list.innerHTML=""

data.matches.forEach(c=>{

const div=document.createElement("div")

div.className="bg-slate-800 p-3 rounded cursor-pointer hover:bg-slate-700"

div.innerHTML=`

<div class="flex items-center gap-3">

<img src="${c.photo}" class="w-10 h-10 rounded-full">

<div class="flex-1">

<div class="font-semibold">
${c.name}
</div>

<div class="text-xs text-slate-400">
${c.role}
</div>

</div>

<div class="font-bold text-lg">
${c.score}
</div>

</div>

`

div.onclick=()=>selectCandidate(c)

list.appendChild(div)

})

if(data.matches.length>0){
selectCandidate(data.matches[0])
}

}

function selectCandidate(c){

document.getElementById("candidateScore").innerText=c.score

const values=Object.values(c.block_scores)

radar.data.datasets[1].data=values
radar.update()

calculateTeam(values)

showTeamGaps()

showCandidateImpact(c)

}

function calculateTeam(values){

const avg=Math.round(values.reduce((a,b)=>a+b)/values.length)

document.getElementById("teamScore").innerText=avg

if(avg>90){
document.getElementById("teamArchetype").innerText="THE BUILDERS"
}
else if(avg>80){
document.getElementById("teamArchetype").innerText="THE STRATEGISTS"
}
else{
document.getElementById("teamArchetype").innerText="THE OPERATORS"
}

radar.data.datasets[0].data=values.map(v=>v-3)
radar.update()

}

async function showTeamGaps(){

const team=document.getElementById("teamSelector").value

const res=await fetch(`/teams/${team}/gaps`,{
headers:{Authorization:`Bearer ${token}`}
})

const data=await res.json()

const gaps=document.getElementById("teamGaps")

gaps.innerHTML=""

if(!data.gaps || data.gaps.length===0){

gaps.innerHTML=`
<div class="text-slate-400 text-sm">
No structural gaps detected
</div>
`

return
}

data.gaps.forEach(g=>{

const div=document.createElement("div")

div.className="bg-slate-800 p-3 rounded mb-2"

div.innerHTML=`

<div class="font-semibold text-indigo-400">
${g.block}
</div>

<div class="text-xs text-slate-400">
${g.message}
</div>

`

gaps.appendChild(div)

})

}

function showCandidateImpact(c){

const impact=document.getElementById("candidateImpact")

impact.innerHTML=`

<div class="text-indigo-400 font-semibold mb-2">
Impact if ${c.name} joins
</div>

<div class="bg-slate-800 p-3 rounded">

<div class="text-xs text-green-400">
✓ Leadership stability improved
</div>

<div class="text-xs text-green-400">
✓ Emotional resilience increased
</div>

<div class="text-xs text-green-400">
✓ Team balance +${Math.floor(Math.random()*10)+3}%
</div>

</div>

`

}

initRadar()
loadCandidates()

</script>

</body>

</html>
