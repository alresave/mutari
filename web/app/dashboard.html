<!DOCTYPE html>
<html class="dark">
<head>

<meta charset="UTF-8">
<title>Mutari — Team Intelligence</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
tailwind.config = { darkMode: "class" }
</script>

<style>

body{
background:#020617;
}

.glow{
box-shadow:0 0 30px rgba(99,102,241,0.25);
}

.candidate{
transition:all .2s;
border:1px solid transparent;
}

.candidate:hover{
transform:scale(1.05);
background:#1e293b;
border-color:#6366f1;
box-shadow:0 0 20px rgba(99,102,241,0.4);
}

.candidate.active{
background:#312e81;
border-color:#818cf8;
box-shadow:0 0 25px rgba(129,140,248,0.6);
transform:scale(1.05);
}

.bar{
transition:width .6s ease;
}

.score{
font-size:48px;
font-weight:bold;
color:#6366f1;
}

</style>

</head>

<body class="text-slate-200">

<div class="max-w-7xl mx-auto p-8">

<div class="flex items-center justify-between mb-10">

<div class="flex items-center gap-6">

<img src="images/logo.png" style="height:256px">

<div>
<div class="text-4xl font-bold">Mutari</div>
<div class="text-sm text-slate-400">AI Team Intelligence</div>
</div>

</div>

<select id="teamSelect"
class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-lg">
</select>

</div>
<div class="mb-6">
  <div id="selectedTeamLabel" class="text-sm text-slate-400">
    Selected Team →
    <span class="text-indigo-400 font-semibold">—</span>
  </div>
</div>
<div id="decisionSummary" class="mb-6 text-sm"></div>

<div class="grid grid-cols-3 gap-8 mb-8">

<div class="bg-slate-900 p-6 rounded-xl border border-slate-800 glow">
<div class="text-xl font-semibold mb-4">Team Archetype</div>
<div id="teamArchetype" class="text-3xl font-bold mb-4 text-indigo-400">—</div>
<div class="text-sm text-slate-400">
Behavioral structure derived from team vectors
</div>
</div>

<div class="bg-slate-900 p-6 rounded-xl border border-slate-800 glow">
<div class="text-xl font-semibold mb-4">Team vs Candidate Genome</div>
<canvas id="radarChart"></canvas>
</div>

<div class="bg-slate-900 p-6 rounded-xl border border-slate-800 glow">
<div class="text-xl font-semibold mb-4">Candidates</div>
<div id="candidates" class="space-y-3 max-h-[420px] overflow-y-auto"></div>
</div>

</div>

<div class="grid grid-cols-3 gap-8 mb-8">

<div class="bg-slate-900 p-6 rounded-xl border border-slate-800 glow">
<div class="text-xl font-semibold mb-4">Team Gaps</div>
<div id="gaps" class="space-y-4"></div>
</div>

<div class="bg-slate-900 p-6 rounded-xl border border-slate-800 glow">
<div class="text-xl font-semibold mb-4">Ideal Hiring Profile</div>
<div id="role" class="text-2xl font-bold mb-4 text-indigo-400"></div>
<ul id="traits" class="space-y-2 text-sm"></ul>
</div>

<div class="bg-slate-900 p-6 rounded-xl border border-slate-800 glow">
<div class="text-xl font-semibold mb-4">AI Reasoning</div>
<div id="reasoning" class="text-sm text-slate-300"></div>
</div>

</div>

<div class="bg-slate-900 p-6 rounded-xl border border-slate-800 glow">

<div class="text-xl font-semibold mb-6">Team Impact Simulation</div>

<div class="grid grid-cols-3 text-center">

<div>
<div class="text-sm text-slate-400">Current Team Score</div>
<div id="teamScore" class="score">—</div>
</div>

<div>
<div class="text-sm text-slate-400">With Candidate</div>
<div id="candidateScore" class="score">—</div>
</div>

<div>
<div class="text-sm text-slate-400">Impact</div>
<div id="impact" class="score">—</div>
</div>

</div>

</div>

</div>

<script>

/* AUTH */

const token = localStorage.getItem("token")
let bestCandidate = null
let teamScoreGlobal = 0
let bestRow = null
const groupOrder = ["best", "strategic", "good", "neutral", "risky"]

const headers = {
"Authorization":"Bearer "+token
}

/* STATE */

let radar = null
let currentTeam = null
let teamVector = null

const labels = [
"Execution Drive",
    "Cognitive Processing",
    "Professional Values",
    "Emotional Resilience",
    "Learning Velocity",
    "Collaboration Depth",
    "Operational Rhythm",
    "Team Positioning"
]

/* RADAR */

function createRadar(team,candidate){

if(!team) return

if(radar) radar.destroy()

radar = new Chart(
document.getElementById("radarChart"),
{
type:"radar",

data:{
labels:labels,

datasets:[

{
label:"Team",
data:team,
borderColor:"#6366f1",
backgroundColor:"rgba(99,102,241,0.2)"
},

{
label:"Candidate",
data:candidate || team,
borderColor:"#22c55e",
backgroundColor:"rgba(34,197,94,0.2)"
}

]

},

options:{
plugins:{legend:{labels:{color:"#cbd5f5"}}},
scales:{
r:{
min:0,
max:1,
ticks:{display:false},
grid:{color:"#1e293b"}
}
}
}
})
}

/* LOAD TEAMS */

async function loadTeams(){

  try{

    const res = await fetch("/teams",{headers})
    const data = await res.json()

    const teams = Array.isArray(data) ? data : data.teams

    const select = document.getElementById("teamSelect")
    select.innerHTML = ""

    // ✅ crear el mapa UNA sola vez
    window.teamMap = {}

    teams.forEach(team=>{

      // guardar nombre
      teamMap[team.id] = team.name

      const option = document.createElement("option")
      option.value = team.id
      option.innerText = team.name

      select.appendChild(option)

    })

    // cambio de team
    select.onchange = () => loadTeam(select.value)

    // cargar primero automáticamente
    if(teams.length > 0){
      loadTeam(teams[0].id)
    }

  } catch(err){

    console.error("Error loading teams:", err)

  }

}

/* LOAD TEAM */

async function loadTeam(teamId){

  currentTeam = teamId

  // 🔥 actualizar breadcrumb
  const teamName = teamMap[teamId] || teamId

  document.getElementById("selectedTeamLabel").innerHTML = `
    Selected Team →
    <span class="text-indigo-400 font-semibold">${teamName}</span>
  `

  await loadTeamInfo(teamId)
  await loadGaps(teamId)
  await loadHiring(teamId)
  await loadCandidates(teamId)

}

/* =========================
LOAD TEAM INFO (TU VERSION)
========================= */

async function loadTeamInfo(teamId){

  try{

    const res = await fetch(`/teams/${teamId}/matches`,{headers})

    if(!res.ok){
      console.error("Matches request failed:",res.status)
      return
    }

    const data = await res.json()

    let matches = []

    if(Array.isArray(data)) matches = data
    else if(data.matches) matches = data.matches
    else if(data.data) matches = data.data

    if(matches.length === 0) return

    // 🔥 usar mejor candidato REAL
    const best = [...matches].sort((a,b)=>(b.score||0)-(a.score||0))[0]

    if(!best) return

    const vector = Object.values(best.block_scores || {}).map(v => v/100)

    teamVector = vector
    createRadar(teamVector)

    teamScoreGlobal = Math.round(best.score || 0)

    document.getElementById("teamScore").innerText = teamScoreGlobal

    document.getElementById("teamArchetype").innerText =
      best.role || "Balanced Team"

  }catch(err){

    console.error("Error loading team info:",err)

  }

}

/* GAPS */

async function loadGaps(teamId){

  try{

    const res = await fetch(`/teams/${teamId}/gaps`, { headers })
    const data = await res.json()

    // 🔥 guardar global para AI reasoning
    window.teamGaps = data

    const container = document.getElementById("gaps")
    container.innerHTML = ""

    const row = document.createElement("div")

    const weakBlocks = data.weak_blocks || []

    row.innerHTML = `
      <div class="bg-slate-800 rounded-lg p-4 space-y-3">

        <div class="flex justify-between text-sm">
          <span class="text-slate-400">Selected Team</span>
          <span class="font-medium">${teamMap[data.team_id] || data.team_id}</span>
        </div>

        <div>
          <span class="text-slate-400 text-sm">Weak Blocks</span>
          <ul class="list-disc list-inside text-sm mt-1">
            ${
              weakBlocks.length > 0
              ? weakBlocks.map(w => `<li>${w}</li>`).join("")
              : `<li class="text-slate-500">No critical gaps</li>`
            }
          </ul>
        </div>

        <div class="flex justify-between text-sm">
          <span class="text-slate-400">Recommended Profile</span>
          <span class="font-medium text-indigo-400">
            ${data.recommended_profile?.role || data.recommended_profile || "-"}
          </span>
        </div>

      </div>
    `

    container.appendChild(row)

  }catch(err){

    console.error("Error loading gaps:", err)

  }
}
function getBadge(type){

  switch(type){

    case "best":
      return `<span class="text-green-400 text-xs font-bold">BEST</span>`

    case "strategic":
      return `<span class="text-yellow-400 text-xs font-bold">STRATEGIC</span>`

    case "good":
      return `<span class="text-indigo-400 text-xs font-bold">GOOD</span>`

    case "risky":
      return `<span class="text-red-400 text-xs font-bold">RISKY</span>`

    default:
      return `<span class="text-slate-400 text-xs">NEUTRAL</span>`
  }
}
function classifyCandidate(candidate){

  const weakBlocks = window.teamGaps?.weak_blocks || []
  const topBlock = candidate.top_block || "-"

 const teamScore = teamScoreGlobal

const impact = (candidate.score || 0) - teamScore

  const HIGH = 15
  const MEDIUM = 5

  const fillsGap = weakBlocks.includes(topBlock)

  // 🟢 BEST → SOLO si llena gap + alto impacto
  if(fillsGap && impact >= HIGH){
    return "best"
  }

  // 🟡 STRATEGIC → llena gap (aunque impacto medio)
  if(fillsGap && impact >= 0){
    return "strategic"
  }

  // 🔵 GOOD → mejora fuerte pero NO gap
  if(impact >= HIGH){
    return "good"
  }

  // 🔵 GOOD (media)
  if(impact >= MEDIUM){
    return "good"
  }

  // ⚖️ NEUTRAL
  if(impact >= 0){
    return "neutral"
  }

  // 🔴 RISKY
  return "risky"
}

function buildBlockDelta(candidate){

  if(!teamVector || !candidate.block_scores) return ""

  const deltas = []

  const blocks = Object.keys(candidate.block_scores)

  blocks.forEach((block, i)=>{

    const teamVal = teamVector[i] || 0
    const candidateVal = (candidate.block_scores[block] || 0) / 100

    const diff = Math.round((candidateVal - teamVal) * 100)

    if(Math.abs(diff) >= 5){
      deltas.push({
        block,
        diff
      })
    }
  })

  // ordenar por impacto
  deltas.sort((a,b)=>Math.abs(b.diff) - Math.abs(a.diff))

  return deltas.slice(0,3)
}

function buildSmartReasoning(data, candidateName){

  const gaps = window.teamGaps

  const topBlock = data.top_block || "-"
  const weakBlocks = gaps?.weak_blocks || []

  const teamScore = teamScoreGlobal

  const candidateScore = data.score || 0

  const HIGH_IMPACT = 15
  const MEDIUM_IMPACT = 5

  const impact = candidateScore - teamScore

  // 🟢 IDEAL HIRE (llena gap + alto impacto)
  if(weakBlocks.includes(topBlock) && impact >= HIGH_IMPACT){
    return `
    <b class="text-green-400">${candidateName}</b> is an ideal hire,
    filling a critical gap in <b>${topBlock}</b> while significantly improving team performance
    `
  }

  // 🟡 GAP + impacto positivo moderado
  if(weakBlocks.includes(topBlock) && impact >= MEDIUM_IMPACT){
    return `
    <b class="text-green-400">${candidateName}</b> fills a key gap in <b>${topBlock}</b>,
    improving team balance and performance
    `
  }

  // 🟡 GAP pero impacto negativo
  if(weakBlocks.includes(topBlock) && impact < 0){
    return `
    <b class="text-yellow-400">${candidateName}</b> fills a critical gap in <b>${topBlock}</b>,
    but slightly reduces overall team compatibility
    `
  }

  // 🟢 HIGH IMPACT SIN GAP
  if(!weakBlocks.includes(topBlock) && impact >= HIGH_IMPACT){
    return `
    <b class="text-green-400">${candidateName}</b> is a high-impact hire,
    significantly strengthening <b>${topBlock}</b> and boosting team performance
    `
  }

  // 🔵 STRONG ADDITION
  if(!weakBlocks.includes(topBlock) && impact >= MEDIUM_IMPACT){
    return `
    <b class="text-indigo-400">${candidateName}</b> is a strong addition,
    reinforcing <b>${topBlock}</b> and improving overall team performance
    `
  }

  // 🔵 IMPACTO BAJO POSITIVO
  if(impact > 0){
    return `
    <b class="text-slate-300">${candidateName}</b> brings a modest improvement,
    slightly strengthening <b>${topBlock}</b>
    `
  }

  // 🔴 NEGATIVO
  if(impact < 0){
    return `
    <b class="text-red-400">${candidateName}</b> may introduce misalignment,
    reducing team effectiveness despite strengths in <b>${topBlock}</b>
    `
  }

  // 🔵 DEFAULT
  return `
  <b class="text-indigo-400">${candidateName}</b> reinforces team strength in <b>${topBlock}</b>
  `
}

/* HIRING */

async function loadHiring(teamId){

const res = await fetch(`/teams/${teamId}/hiring-profile`,{headers})
const data = await res.json()

document.getElementById("role").innerText =
data.suggested_role || ""

const traits=document.getElementById("traits")
traits.innerHTML=""

const list = data.recommended_traits || []

list.forEach(t=>{

const li=document.createElement("li")
li.innerText="• "+t

traits.appendChild(li)

})

}

/* CANDIDATES */

let demoCandidates=[]
let demoIndex=0

async function loadCandidates(teamId){

  try{

    const res = await fetch(`/teams/${teamId}/matches`, { headers })
    const data = await res.json()

    let matches = []

    if(Array.isArray(data)) matches = data
    else if(data.matches) matches = data.matches
    else if(data.data) matches = data.data

    const container = document.getElementById("candidates")
    container.innerHTML = ""

    demoCandidates = matches

    // 🔥 STEP 1: calcular tipo UNA sola vez
    matches = matches.map(c => {
      const type = classifyCandidate(c)
      return {
        ...c,
        type,
        score: c.score || 0
      }
    })

    // 🔥 STEP 2: ordenar estable
    const order = {
      best: 4,
      strategic: 3,
      good: 2,
      neutral: 1,
      risky: 0
    }

    matches.sort((a, b) => {

      const aType = order[a.type] ?? 1
      const bType = order[b.type] ?? 1

      if (bType !== aType) return bType - aType
      if (b.score !== a.score) return b.score - a.score

      return (a.name || "").localeCompare(b.name || "")
    })

    // 🔥 BEST
    bestCandidate = matches.length > 0 ? matches[0] : null

    const pinnedBest = bestCandidate
    const rest = matches.slice(1)

    // 🔥 agrupar
    const groups = {
      best: [],
      strategic: [],
      good: [],
      neutral: [],
      risky: []
    }

    rest.forEach(c => {
      const type = c.type || "neutral"
      groups[type]?.push(c)
    })

    // 🔥 RENDER BEST
    if(pinnedBest){

      const header = document.createElement("div")
      header.className = "text-xs text-green-400 mb-2 uppercase tracking-wide"
      header.innerText = "⭐ Top Recommendation"

      container.appendChild(header)

      const row = document.createElement("div")
      bestRow = row

      row.className = `
candidate flex justify-between items-center p-4 rounded cursor-pointer
bg-green-900/50 border border-green-400 shadow-xl scale-[1.02]
`

      row.innerHTML = `
        <div class="flex items-center gap-3">
          <img src="${pinnedBest.photo || 'https://i.pravatar.cc/40'}"
          class="w-10 h-10 rounded-full">

          <div>
            <div class="flex items-center gap-2">
              <div class="font-semibold text-white">${pinnedBest.name}</div>
              ${getBadge("best")}
            </div>

            <div class="text-xs text-green-300">
              Highest impact candidate
            </div>
          </div>
        </div>

        <div class="text-green-400 font-bold text-lg">
          ${pinnedBest.score}%
        </div>
      `

      row.onclick = () => {

        document.querySelectorAll(".candidate").forEach(el=>{
          el.classList.remove("active")
          el.style.boxShadow = ""
        })

        row.classList.add("active")

        loadCandidateFit(
          pinnedBest.user_id || pinnedBest.id,
          pinnedBest.name || "Candidate"
        )
      }

      container.appendChild(row)
    }

    // 🔥 RENDER GRUPOS
    groupOrder.forEach(type => {

      if(groups[type].length === 0) return

      const header = document.createElement("div")
      header.className = "text-xs text-slate-400 mt-4 mb-1 uppercase tracking-wide"

      header.innerHTML = `
        <span class="
          ${type === "best" ? "text-green-400" : ""}
          ${type === "strategic" ? "text-yellow-400" : ""}
          ${type === "good" ? "text-indigo-400" : ""}
          ${type === "risky" ? "text-red-400" : ""}
        ">
          ${type.toUpperCase()} (${groups[type].length})
        </span>
      `

      container.appendChild(header)

      groups[type].forEach(c => {

        const row = document.createElement("div")

        row.className = `
candidate flex justify-between items-center p-3 rounded cursor-pointer
${c.type === "best"
  ? "bg-green-900/40 border border-green-400/40 shadow-lg"
  : c.type === "strategic"
  ? "bg-yellow-900/20 border border-yellow-400/30"
  : c.type === "good"
  ? "bg-indigo-900/20 border border-indigo-400/20"
  : "bg-slate-800"
}
`

        row.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${c.photo || 'https://i.pravatar.cc/40'}"
            class="w-10 h-10 rounded-full">

            <div>
              <div class="flex items-center gap-2">
                <div class="font-semibold">${c.name || "Candidate"}</div>
                ${getBadge(c.type)}
              </div>

              <div class="text-xs text-slate-400">
                ${c.role || c.suggested_role || ""}
              </div>
            </div>
          </div>

          <div class="text-indigo-400 font-bold">
            ${c.score || 0}%
          </div>
        `

        row.onclick = () => {

          document.querySelectorAll(".candidate").forEach(el=>{
            el.classList.remove("active")
            el.style.boxShadow = ""
          })

          row.classList.add("active")

          loadCandidateFit(
            c.user_id || c.id,
            c.name || "Candidate"
          )
        }

        container.appendChild(row)
      })
    })

    // 🔥 AUTO SELECT BEST
    if(bestCandidate){

      if(bestRow){
        bestRow.classList.add("active")
        bestRow.scrollIntoView({ behavior:"smooth", block:"center" })
      }

      loadCandidateFit(
        bestCandidate.user_id || bestCandidate.id,
        bestCandidate.name || "Candidate"
      )

      document.getElementById("decisionSummary").innerHTML = `
        <div class="bg-slate-800 p-4 rounded-lg border border-green-400/30">

          <div class="text-green-400 font-semibold mb-1">
            💡 Recommended Hire
          </div>

          <div class="text-white font-bold text-lg">
            ${bestCandidate.name}
          </div>

          <div class="text-sm text-slate-400">
            ${buildSmartReasoning(bestCandidate, bestCandidate.name)}

            <div class="mt-2 space-y-1 text-xs">
              ${
                buildBlockDelta(bestCandidate).map(d => `
                  <div class="${d.diff > 0 ? 'text-green-400' : 'text-red-400'}">
                    ${d.diff > 0 ? '+' : ''}${d.diff}% ${d.block}
                  </div>
                `).join("")
              }
            </div>
          </div>

        </div>
      `
    }

  }catch(err){
    console.error("Error loading candidates:", err)
  }

}

/* FIT */

async function loadCandidateFit(candidateId, candidateName = "Candidate"){

  try{

    const res = await fetch(`/teams/${currentTeam}/fit/${candidateId}`,{headers})
    const data = await res.json()

    const candidateVector =
      Object.values(data.block_scores || {}).map(v=>v/100)

    createRadar(teamVector, candidateVector)

    const teamScore = teamScoreGlobal

    const candidateScore = data.score || 0
    const impact = candidateScore - teamScore

    // 🔥 reasoning inteligente + impacto
    let reasoning = buildSmartReasoning(data, candidateName)

// 🔥 comparación vs best
reasoning += buildComparisonInsight(data, candidateName)

    if(impact !== 0){
      reasoning += `<br><span class="text-sm text-slate-400">
        Impact: <b class="${impact > 0 ? 'text-green-400' : 'text-red-400'}">
        ${impact > 0 ? '+' : ''}${impact}%
        </b>
      </span>`
    }

    document.getElementById("reasoning").innerHTML = reasoning

    document.getElementById("candidateScore").innerText = candidateScore

    document.getElementById("impact").innerText =
      (impact >= 0 ? "+" : "") + impact

  }catch(err){

    console.error("Error loading candidate fit:", err)

  }

}

function buildComparisonInsight(data, candidateName){

  if(!bestCandidate) return ""

  const bestScore = bestCandidate.score || 0
  const currentScore = data.score || 0

  const diff = currentScore - bestScore

  // si es el mismo candidato → no mostrar nada
  if((data.user_id || data.id) === (bestCandidate.user_id || bestCandidate.id)){
    return ""
  }

  const weakerBlock = data.top_block || "-"

  if(diff < 0){
    return `
      <br>
      <span class="text-xs text-red-400">
        ${diff}% vs ${bestCandidate.name} (recommended)
      </span>
      <br>
      <span class="text-xs text-slate-500">
        Weaker in ${weakerBlock}
      </span>
    `
  }

  if(diff > 0){
    return `
      <br>
      <span class="text-xs text-green-400">
        +${diff}% vs ${bestCandidate.name}
      </span>
    `
  }

  return ""
}

/* DEMO MODE */

const params = new URLSearchParams(window.location.search)
const demoMode = params.get("demo") === "true"

function startDemo(){

if(!demoMode) return

setTimeout(()=>{
cycleCandidates()
},2000)

}

function cycleCandidates(){

if(!demoMode) return
if(demoCandidates.length === 0) return

const candidate = demoCandidates[demoIndex]

loadCandidateFit(
  candidate.user_id || candidate.id,
  candidate.name || "Candidate"
)

demoIndex++

if(demoIndex >= demoCandidates.length){
demoIndex = 0
}

setTimeout(cycleCandidates,3500)

}

/* INIT */

loadTeams()

setTimeout(()=>{
startDemo()
},2000)

</script>

</body>
</html>
