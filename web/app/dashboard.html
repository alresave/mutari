  function buildTopComparison(best, second){

  if(!best || !second) return ""

  const diff = (best.score || 0) - (second.score || 0)

  return `
    <div class="mt-3 p-3 rounded-lg bg-slate-900 border border-slate-700">

        Alternative Option

      <div class="text-xs mt-1 ${
        diff > 0 ? "text-green-400" : "text-red-400"
      }">
        ${diff > 0 ? '+' : ''}${diff}% vs ${best.name}
      </div>

    </div>
  `
}
function buildWhyBestWins(best){

  if(!best || !teamVector) return ""

  const deltas = buildBlockDelta(best)

  if(!deltas || deltas.length === 0) return ""

  const positives = deltas.filter(d => d.diff > 0)
  const negatives = deltas.filter(d => d.diff < 0)

  return `
    <div class="mt-4 p-3 rounded-lg bg-slate-900 border border-indigo-500/30">

      <div class="text-xs text-indigo-400 mb-2 font-semibold">
        Why this candidate wins
      </div>

      <div class="space-y-1 text-xs">

        ${
          positives.map(d => `
            <div class="text-green-400">
              +${d.diff}% ${d.block}
            </div>
          `).join("")
        }

        ${
          negatives.map(d => `
            <div class="text-red-400">
              ${d.diff}% ${d.block}
              <span class="text-slate-500">(tradeoff)</span>
            </div>
          `).join("")
        }

      </div>

    </div>
  `
}

function buildSideBySide(best, second){

  if(!best || !second || !teamVector) return ""

  const bestDeltas = buildBlockDelta(best)
  const secondDeltas = buildBlockDelta(second)

  const mapSecond = {}
  secondDeltas.forEach(d => {
    mapSecond[d.block] = d.diff
  })

  return `
    <div class="mt-4 p-3 rounded-lg bg-slate-900 border border-yellow-500/30">

      <div class="text-xs text-yellow-400 mb-2 font-semibold">
        Best vs Alternative
      </div>

      <div class="space-y-1 text-xs">
        ${
          bestDeltas.map(d => {
            const secondVal = mapSecond[d.block] || 0

            return `
              <div class="flex justify-between">
                <span>${d.block}</span>

                <span class="flex gap-3">
                  <span class="${d.diff >= 0 ? 'text-green-400' : 'text-red-400'}">
                    ${d.diff > 0 ? '+' : ''}${d.diff}%
                  </span>

                  <span class="text-slate-500">vs</span>

                  <span class="${secondVal >= 0 ? 'text-green-400' : 'text-red-400'}">
                    ${secondVal > 0 ? '+' : ''}${secondVal}%
                  </span>
                </span>
              </div>
            `
          }).join("")
        }
      </div>

    </div>
  `
}

async function loadTeamInfo(teamId){

  try{

    const res = await fetch(`/teams/${teamId}/matches`,{headers})

    if(!res.ok){
      console.error("Matches request failed:",res.status)
      return
    }

    const data = await res.json()

    let matches = []

    if(Array.isArray(data)) matches = data
    else if(data.matches) matches = data.matches
    else if(data.data) matches = data.data

    if(matches.length === 0) return

    // 🔥 usar mejor candidato REAL
    const best = [...matches].sort((a,b)=>(b.score||0)-(a.score||0))[0]

    if(!best) return

    const vector = Object.values(best.block_scores || {}).map(v => v/100)

    teamVector = vector
    createRadar(teamVector)

    teamScoreGlobal = Math.round(best.score || 0)

    document.getElementById("teamScore").innerText = teamScoreGlobal

    document.getElementById("teamArchetype").innerText =
      best.role || "Balanced Team"

  }catch(err){

    console.error("Error loading team info:",err)

  }

}

function classifyCandidate(candidate){

  const weakBlocks = window.teamGaps?.weak_blocks || []
  const topBlock = candidate.top_block || "-"

 const teamScore = teamScoreGlobal

const impact = (candidate.score || 0) - teamScore

  const HIGH = 15
  const MEDIUM = 5

  const fillsGap = weakBlocks.includes(topBlock)

  // 🟢 BEST → SOLO si llena gap + alto impacto
  if(fillsGap && impact >= HIGH){
    return "best"
  }

  // 🟡 STRATEGIC → llena gap (aunque impacto medio)
  if(fillsGap && impact >= 0){
    return "strategic"
  }

  // 🔵 GOOD → mejora fuerte pero NO gap
  if(impact >= HIGH){
    return "good"
  }

  // 🔵 GOOD (media)
  if(impact >= MEDIUM){
    return "good"
  }

  // ⚖️ NEUTRAL
  if(impact >= 0){
    return "neutral"
  }

  // 🔴 RISKY
  return "risky"
}

function buildBlockDelta(candidate){

  if(!teamVector || !candidate.block_scores) return ""

  const deltas = []

  const blocks = Object.keys(candidate.block_scores)

  blocks.forEach((block, i)=>{

    const teamVal = teamVector[i] || 0
    const candidateVal = (candidate.block_scores[block] || 0) / 100

    const diff = Math.round((candidateVal - teamVal) * 100)

    if(Math.abs(diff) >= 5){
      deltas.push({
        block,
        diff
      })
    }
  })

  // ordenar por impacto
  deltas.sort((a,b)=>Math.abs(b.diff) - Math.abs(a.diff))

  return deltas.slice(0,3)
}

function buildSmartReasoning(data, candidateName){

  const gaps = window.teamGaps

  const topBlock = data.top_block || "-"
  const weakBlocks = gaps?.weak_blocks || []

  const teamScore = teamScoreGlobal

  const candidateScore = data.score || 0

  const HIGH_IMPACT = 15
  const MEDIUM_IMPACT = 5

  const impact = candidateScore - teamScore

  // 🟢 IDEAL HIRE (llena gap + alto impacto)
  if(weakBlocks.includes(topBlock) && impact >= HIGH_IMPACT){
    return `
    <b class="text-green-400">${candidateName}</b> is an ideal hire,
    filling a critical gap in <b>${topBlock}</b> while significantly improving team performance
    `
  }

  // 🟡 GAP + impacto positivo moderado
  if(weakBlocks.includes(topBlock) && impact >= MEDIUM_IMPACT){
    return `
    <b class="text-green-400">${candidateName}</b> fills a key gap in <b>${topBlock}</b>,
    improving team balance and performance
    `
  }

  // 🟡 GAP pero impacto negativo
  if(weakBlocks.includes(topBlock) && impact < 0){
    return `
    <b class="text-yellow-400">${candidateName}</b> fills a critical gap in <b>${topBlock}</b>,
    but slightly reduces overall team compatibility
    `
  }

  // 🟢 HIGH IMPACT SIN GAP
  if(!weakBlocks.includes(topBlock) && impact >= HIGH_IMPACT){
    return `
    <b class="text-green-400">${candidateName}</b> is a high-impact hire,
    significantly strengthening <b>${topBlock}</b> and boosting team performance
    `
  }

  // 🔵 STRONG ADDITION
  if(!weakBlocks.includes(topBlock) && impact >= MEDIUM_IMPACT){
    return `
    <b class="text-indigo-400">${candidateName}</b> is a strong addition,
    reinforcing <b>${topBlock}</b> and improving overall team performance
    `
  }

  // 🔵 IMPACTO BAJO POSITIVO
  if(impact > 0){
    return `
    <b class="text-slate-300">${candidateName}</b> brings a modest improvement,
    slightly strengthening <b>${topBlock}</b>
    `
  }

  // 🔴 NEGATIVO
  if(impact < 0){
    return `
    <b class="text-red-400">${candidateName}</b> may introduce misalignment,
    reducing team effectiveness despite strengths in <b>${topBlock}</b>
    `
  }

  // 🔵 DEFAULT
  return `
  <b class="text-indigo-400">${candidateName}</b> reinforces team strength in <b>${topBlock}</b>
  `
}

      neutral: 1,
      risky: 0
    }

    matches.sort((a, b) => {

      const aType = order[a.type] ?? 1
      const bType = order[b.type] ?? 1

      if (bType !== aType) return bType - aType
      if (b.score !== a.score) return b.score - a.score

      return (a.name || "").localeCompare(b.name || "")
    })

    // 🔥 BEST
    bestCandidate = matches.length > 0 ? matches[0] : null
    const secondCandidate = matches[1] || null
    secondCandidateGlobal = secondCandidate

    const pinnedBest = bestCandidate
    const rest = matches.slice(1)

    // 🔥 agrupar
    const groups = {
      best: [],
      strategic: [],
      good: [],
      neutral: [],
      risky: []
    }

    rest.forEach(c => {
      const type = c.type || "neutral"
      groups[type]?.push(c)
    })

    // 🔥 RENDER BEST
    if(pinnedBest){

      const header = document.createElement("div")
      header.className = "text-xs text-green-400 mb-2 uppercase tracking-wide"
      header.innerText = "⭐ Top Recommendation"

      container.appendChild(header)

      const row = document.createElement("div")
      bestRow = row

      row.className = `
candidate flex justify-between items-center p-4 rounded cursor-pointer
bg-green-900/50 border border-green-400 shadow-xl scale-[1.02]
`

      row.innerHTML = `
        <div class="flex items-center gap-3">
          <img src="${pinnedBest.photo || 'https://i.pravatar.cc/40'}"
          class="w-10 h-10 rounded-full">

          <div>
            <div class="flex items-center gap-2">
              <div class="font-semibold text-white">${pinnedBest.name}</div>
              ${getBadge("best")}
            </div>

            <div class="text-xs text-green-300">
              Highest impact candidate
            </div>
          </div>
        </div>

        <div class="text-green-400 font-bold text-lg">
          ${pinnedBest.score}%
        </div>
      `

      row.onclick = () => {

        document.querySelectorAll(".candidate").forEach(el=>{
          el.classList.remove("active")
          el.style.boxShadow = ""
        })

        row.classList.add("active")

        loadCandidateFit(
          pinnedBest.user_id || pinnedBest.id,
          pinnedBest.name || "Candidate"
        )
      }

      container.appendChild(row)
    }

    // 🔥 RENDER GRUPOS
    groupOrder.forEach(type => {

      if(groups[type].length === 0) return

      const header = document.createElement("div")
      header.className = "text-xs text-slate-400 mt-4 mb-1 uppercase tracking-wide"

      header.innerHTML = `
        <span class="
          ${type === "best" ? "text-green-400" : ""}
          ${type === "strategic" ? "text-yellow-400" : ""}
          ${type === "good" ? "text-indigo-400" : ""}
          ${type === "risky" ? "text-red-400" : ""}
        ">
          ${type.toUpperCase()} (${groups[type].length})
        </span>
      `

      container.appendChild(header)

      groups[type].forEach(c => {

        const row = document.createElement("div")

        row.className = `
candidate flex justify-between items-center p-3 rounded cursor-pointer
${c.type === "best"
  ? "bg-green-900/40 border border-green-400/40 shadow-lg"
  : c.type === "strategic"
  ? "bg-yellow-900/20 border border-yellow-400/30"
  : c.type === "good"
  ? "bg-indigo-900/20 border border-indigo-400/20"
  : "bg-slate-800"
}
`

        row.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${c.photo || 'https://i.pravatar.cc/40'}"
            class="w-10 h-10 rounded-full">

            <div>
              <div class="flex items-center gap-2">
                <div class="font-semibold">${c.name || "Candidate"}</div>
                ${getBadge(c.type)}
              </div>

              <div class="text-xs text-slate-400">
                ${c.role || c.suggested_role || ""}
              </div>
            </div>
          </div>

          <div class="text-indigo-400 font-bold">
            ${c.score || 0}%
          </div>
        `

        row.onclick = () => {

          document.querySelectorAll(".candidate").forEach(el=>{
            el.classList.remove("active")
            el.style.boxShadow = ""
          })

          row.classList.add("active")

          loadCandidateFit(
            c.user_id || c.id,
            c.name || "Candidate"
          )
        }

        container.appendChild(row)
      })
    })

    // 🔥 AUTO SELECT BEST
    if(bestCandidate){

      if(bestRow){
        bestRow.classList.add("active")
        bestRow.scrollIntoView({ behavior:"smooth", block:"center" })
      }

      loadCandidateFit(
        bestCandidate.user_id || bestCandidate.id,
        bestCandidate.name || "Candidate"
      )

      document.getElementById("decisionSummary").innerHTML = `
        <div class="bg-slate-800 p-4 rounded-lg border border-green-400/30">

          <div class="text-green-400 font-semibold mb-1">
            💡 Recommended Hire
          </div>

          <div class="text-white font-bold text-lg">
            ${bestCandidate.name}
          </div>

          <div class="text-sm text-slate-400">
            ${buildSmartReasoning(bestCandidate, bestCandidate.name)}
            

           <div class="mt-2 space-y-1 text-xs">
  ${
    buildBlockDelta(bestCandidate).map(d => `
      <div class="${d.diff > 0 ? 'text-green-400' : 'text-red-400'}">
        ${d.diff > 0 ? '+' : ''}${d.diff}% ${d.block}
      </div>
    `).join("")
  }
</div>

${buildTopComparison(bestCandidate, secondCandidate)} 
 ${buildWhyBestWins(bestCandidate)}
 ${buildSideBySide(bestCandidate, secondCandidate)}
          </div>

        </div>
      `
    }

  }catch(err){
    console.error("Error loading candidates:", err)
  }

}

/* FIT */

async function loadCandidateFit(candidateId, candidateName = "Candidate"){

  try{

    const res = await fetch(`/teams/${currentTeam}/fit/${candidateId}`,{headers})
    const data = await res.json()

    const candidateVector =
      Object.values(data.block_scores || {}).map(v=>v/100)

    createRadar(teamVector, candidateVector)

    const teamScore = teamScoreGlobal

    const candidateScore = data.score || 0
    const impact = candidateScore - teamScore

    // 🔥 reasoning inteligente + impacto
    let reasoning = buildSmartReasoning(data, candidateName)

// 🔥 comparación vs best
reasoning += buildComparisonInsight(data, candidateName)

    if(impact !== 0){
      reasoning += `<br><span class="text-sm text-slate-400">
        Impact: <b class="${impact > 0 ? 'text-green-400' : 'text-red-400'}">
        ${impact > 0 ? '+' : ''}${impact}%
        </b>
      </span>`
    }

    document.getElementById("reasoning").innerHTML = reasoning

    document.getElementById("candidateScore").innerText = candidateScore

    document.getElementById("impact").innerText =
      (impact >= 0 ? "+" : "") + impact

  }catch(err){

    console.error("Error loading candidate fit:", err)

  }

}

function buildComparisonInsight(data, candidateName){

  if(!bestCandidate) return ""

  const bestScore = bestCandidate.score || 0
  const currentScore = data.score || 0

  const diff = currentScore - bestScore

  // si es el mismo candidato → no mostrar nada
  if((data.user_id || data.id) === (bestCandidate.user_id || bestCandidate.id)){
    return ""
  }
  

  const weakerBlock = data.top_block || "-"

  if(diff < 0){
    return `
      <br>
      <span class="text-xs text-red-400">
        ${diff}% vs ${bestCandidate.name} (recommended)
      </span>
      <br>
      <span class="text-xs text-slate-500">
        Weaker in ${weakerBlock}
      </span>
    `
  }

  if(diff > 0){
    return `
      <br>
      <span class="text-xs text-green-400">
        +${diff}% vs ${bestCandidate.name}
      </span>
    `
  }

  return ""
}

/* DEMO MODE */

const demoMode = params.get("demo") === "true"

function startDemo(){

if(!demoMode) return

setTimeout(()=>{
cycleCandidates()
},2000)

}

function cycleCandidates(){

if(!demoMode) return
if(demoCandidates.length === 0) return

const candidate = demoCandidates[demoIndex]

loadCandidateFit(
  candidate.user_id || candidate.id,
  candidate.name || "Candidate"
)

demoIndex++

if(demoIndex >= demoCandidates.length){
demoIndex = 0
}

setTimeout(cycleCandidates,3500)

}

/* INIT */

loadTeams()

setTimeout(()=>{
startDemo()
},2000)
