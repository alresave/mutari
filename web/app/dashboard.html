<!DOCTYPE html>
<html class="dark">
<head>

<meta charset="UTF-8">
<title>Mutari — Team Intelligence</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
tailwind.config = { darkMode: "class" }
</script>

</head>

<body class="bg-slate-900 text-slate-200">

<div class="max-w-7xl mx-auto p-8">

<!-- HEADER -->

<div class="flex items-center justify-between mb-10">

<div class="flex items-center gap-6">

<img src="../images/logo.jpg" style="height:120px">

<div>
<div class="text-3xl font-bold">Mutari</div>
<div class="text-sm text-slate-400">AI Team Intelligence</div>
</div>

</div>

<select
id="teamSelect"
class="bg-slate-800 border border-slate-700 px-4 py-2 rounded"
></select>

</div>

<!-- GRID -->

<div class="grid grid-cols-3 gap-8 mb-10">

<!-- RADAR -->

<div class="bg-slate-800 p-6 rounded-xl">

<div class="text-lg font-semibold mb-4">
Team Genome
</div>

<canvas id="radarChart"></canvas>

</div>

<!-- GAPS -->

<div class="bg-slate-800 p-6 rounded-xl">

<div class="text-lg font-semibold mb-4">
Team Gaps
</div>

<div id="gaps"></div>

</div>

<!-- HIRING PROFILE -->

<div class="bg-slate-800 p-6 rounded-xl">

<div class="text-lg font-semibold mb-4">
Ideal Hire
</div>

<div id="role" class="text-xl font-bold mb-4"></div>

<ul id="traits" class="space-y-2 text-sm"></ul>

</div>

</div>

<!-- CANDIDATES -->

<div class="bg-slate-800 p-6 rounded-xl">

<div class="text-lg font-semibold mb-4">
Candidates
</div>

<div
id="candidates"
class="space-y-3 max-h-96 overflow-y-auto"
></div>

</div>

</div>

<script>

const token = localStorage.getItem("token")

if(!token){
alert("Missing token")
}

const headers = {
"Authorization":"Bearer "+token
}

let radar = null
let currentTeam = null

const labels = [
"Core Values",
"Cognitive Style",
"Emotional Stability",
"Relational Architecture",
"Lifestyle Rhythm",
"Ambition",
"Growth",
"Collaboration"
]

function createRadar(data){

if(!data || data.length===0) return

if(radar){
radar.destroy()
}

radar = new Chart(
document.getElementById("radarChart"),
{
type:"radar",

data:{
labels:labels,
datasets:[{
label:"Profile",
data:data,
borderColor:"#6366f1",
backgroundColor:"rgba(99,102,241,0.2)"
}]
},

options:{
responsive:true,
scales:{
r:{
min:0,
max:1,
ticks:{display:false}
}
}
}

})
}

async function loadTeams(){

const res = await fetch("/teams",{headers})
const data = await res.json()

const select = document.getElementById("teamSelect")
select.innerHTML=""

if(!data.teams) return

data.teams.forEach(t=>{

const opt = document.createElement("option")
opt.value = t.id
opt.innerText = t.name

select.appendChild(opt)

})

select.addEventListener("change",()=>{
loadTeam(select.value)
})

if(data.teams.length>0){
loadTeam(data.teams[0].id)
}

}

async function loadTeam(teamId){

currentTeam = teamId

await loadGaps(teamId)
await loadHiring(teamId)
await loadCandidates(teamId)

}

async function loadGaps(teamId){

const res = await fetch(`/teams/${teamId}/gaps`,{headers})
const data = await res.json()

const container = document.getElementById("gaps")
container.innerHTML=""

if(!data.gaps) return

const radarData=[]

Object.entries(data.gaps).forEach(([k,v])=>{

const val = Number(v) || 0

const row = document.createElement("div")

row.innerHTML=`

<div class="flex justify-between text-sm mb-1">
<span>${k}</span>
<span>${Math.round(val*100)}</span>
</div>

<div class="bg-slate-700 h-2 rounded">
<div style="width:${val*100}%" class="bg-indigo-500 h-2 rounded"></div>
</div>

`

container.appendChild(row)

radarData.push(val)

})

createRadar(radarData)

}

async function loadHiring(teamId){

const res = await fetch(`/teams/${teamId}/hiring-profile`,{headers})
const data = await res.json()

if(!data) return

document.getElementById("role").innerText =
data.suggested_role || ""

const traits = document.getElementById("traits")
traits.innerHTML=""

if(data.recommended_traits){

data.recommended_traits.forEach(t=>{

const li=document.createElement("li")
li.innerText="• "+t

traits.appendChild(li)

})

}

}

async function loadCandidates(teamId){

const res = await fetch(`/teams/${teamId}/matches`,{headers})
const data = await res.json()

const container = document.getElementById("candidates")
container.innerHTML=""

if(!data.matches) return

data.matches.forEach(c=>{

const row=document.createElement("div")

row.className="flex justify-between bg-slate-700 p-3 rounded cursor-pointer hover:bg-slate-600"

row.innerHTML=`

<div class="flex items-center gap-3">

<img src="${c.photo || ''}" class="w-10 h-10 rounded-full">

<div>
<div class="font-semibold">${c.name}</div>
<div class="text-xs text-slate-400">${c.role || ''}</div>
</div>

</div>

<div class="text-indigo-400 font-bold">
${c.score || 0}%
</div>

`

row.onclick=()=>loadCandidateFit(c.user_id)

container.appendChild(row)

})

}

async function loadCandidateFit(candidateId){

const res = await fetch(
`/teams/${currentTeam}/fit/${candidateId}`,
{headers}
)

const data = await res.json()

if(!data.block_scores) return

const radarData = labels.map(l=>{
const v = data.block_scores[l]
return v ? v/100 : 0
})

createRadar(radarData)

}

window.onload = loadTeams

</script>

</body>
</html>
