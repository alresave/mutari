<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting - Mutari</title>
    <meta http-equiv="refresh" content="0; url=/app/company-hub.html">
</head>
<body>
<script>
const teamId = localStorage.getItem("current_team_id");
if (teamId) {
    window.location.replace(`/app/company-hub.html?tab=teams#team-${encodeURIComponent(teamId)}`);
} else {
    window.location.replace("/app/company-hub.html?tab=teams");
}
</script>
</body>
</html>
