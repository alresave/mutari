<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Mutari</title>
    
    <link rel="stylesheet" href="./styles/output.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background-color: #020617;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(79, 70, 229, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(51, 65, 85, 0.5);
            backdrop-filter: blur(12px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-field {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.4);
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: #6366f1;
            background: rgba(30, 41, 59, 0.8);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
            outline: none;
        }

        .btn-glow {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            transform: translateY(-1px);
        }

        .hidden-field {
            display: none;
        }
    </style>
</head>

<body class="text-slate-200 min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-md">
    
    <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 mb-4 shadow-inner">
            <span class="text-3xl font-bold text-indigo-400">M</span>
        </div>
        <h1 class="text-4xl font-bold text-white tracking-tight">Mutari</h1>
        <p class="text-slate-400 mt-2 font-medium tracking-wide uppercase text-[10px]">
            Team Intelligence Engine
        </p>
    </div>

    <div class="glass-card p-10 rounded-3xl">
        
        <div class="flex bg-slate-900/50 p-1 rounded-xl mb-8 border border-slate-800">
            <button id="tab-login" onclick="toggleMode('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white transition-all">
                Login
            </button>
            <button id="tab-signup" onclick="toggleMode('signup')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all">
                Sign Up
            </button>
        </div>

        <div class="space-y-5">
            <div id="name-container" class="hidden-field">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Full Name</label>
                <input id="name" type="text" placeholder="John Doe" 
                    class="w-full p-4 rounded-xl input-field text-white placeholder:text-slate-600" />
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Email Address</label>
                <input id="email" type="email" placeholder="name@company.com" 
                    class="w-full p-4 rounded-xl input-field text-white placeholder:text-slate-600" />
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Password</label>
                <input id="password" type="password" placeholder="••••••••" 
                    class="w-full p-4 rounded-xl input-field text-white placeholder:text-slate-600" />
            </div>

            <div id="error" class="text-red-400 text-xs font-medium text-center min-h-[1rem]"></div>

            <button id="main-btn" onclick="handleSubmit()" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white p-4 rounded-xl font-bold btn-glow transition-all mt-4">
                Sign In
            </button>
        </div>

        <p class="text-slate-500 text-center text-xs mt-8 leading-relaxed">
            Optimizing team synergy through <br/> advanced behavioral analytics.
        </p>
    </div>
</div>

<script>
let mode = 'login';

function toggleMode(target) {
    mode = target;
    const nameField = document.getElementById('name-container');
    const mainBtn = document.getElementById('main-btn');
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const errorDiv = document.getElementById('error');
    
    errorDiv.innerText = '';

    if (mode === 'signup') {
        nameField.classList.remove('hidden-field');
        mainBtn.innerText = 'Create Account';
        tabSignup.classList.add('bg-indigo-600', 'text-white');
        tabSignup.classList.remove('text-slate-400');
        tabLogin.classList.remove('bg-indigo-600', 'text-white');
        tabLogin.classList.add('text-slate-400');
    } else {
        nameField.classList.add('hidden-field');
        mainBtn.innerText = 'Sign In';
        tabLogin.classList.add('bg-indigo-600', 'text-white');
        tabLogin.classList.remove('text-slate-400');
        tabSignup.classList.remove('bg-indigo-600', 'text-white');
        tabSignup.classList.add('text-slate-400');
    }
}

async function handleSubmit() {
    if (mode === 'login') {
        await login();
    } else {
        await signup();
    }
}

// --- DENTRO DE LOGIN.HTML ---

async function signup() {
    // ... (tu lógica existente para obtener name, email, password) ...
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const res = await fetch("/auth/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password })
    });

    const data = await res.json();

    if (data.error) {
        document.getElementById("error").innerText = data.error;
        return;
    }

    // ✅ GUARDAR DATOS EN LOCALSTORAGE (Importante para el siguiente paso)
    localStorage.setItem("token", data.token);
    localStorage.setItem("user_id", data.user_id);

    // ✅ REDIRECCIONAR A CREAR EMPRESA EN LUGAR DEL DASHBOARD
    window.location.href = "create-company.html"; 
}

async function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
    });

    const data = await res.json();
    if (data.error) {
        document.getElementById("error").innerText = data.error;
        return;
    }

    localStorage.setItem("token", data.token);
    localStorage.setItem("user_id", data.user.id);

    if (data.profile_complete) {
        window.location.href = "/app/matches.html";
    } else {
        window.location.href = "/app/index.html";
    }
}
</script>

</body>
</html>
