<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Organización — Mutari</title>
    
    <link rel="stylesheet" href="styles/output.css">
    <link rel="stylesheet" href="styles/site.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="page-create-company text-slate-200 min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-md animate-fade-in">
    
    <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-600/20 border border-emerald-500/30 mb-4 shadow-inner">
            <span class="text-3xl font-bold text-emerald-400">M</span>
        </div>
        <h1 class="text-3xl font-black text-white tracking-tight">Configura tu organización</h1>
        <p class="text-slate-400 mt-2 text-[10px] font-bold uppercase tracking-widest">Paso Final</p>
    </div>

    <div class="glass-card p-10 rounded-[2.5rem]">
        
        <div class="space-y-6">
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Nombre de la Empresa</label>
                <input id="company_name" type="text" placeholder="Ej: Alresave Dev Labs" 
                    class="w-full p-4 rounded-xl input-field placeholder:text-slate-600 font-medium" />
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Sitio Web (Opcional)</label>
                <input id="company_website" type="url" placeholder="https://www.tuempresa.com" 
                    class="w-full p-4 rounded-xl input-field placeholder:text-slate-600 font-mono text-xs" />
            </div>

            <div id="error" class="text-red-400 text-xs font-bold text-center min-h-[1rem] bg-red-400/10 rounded-lg py-2 hidden"></div>

            <button id="finish-btn" onclick="createCompany()" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white p-4 rounded-xl font-black btn-glow transition-all">
                FINALIZAR CONFIGURACIÓN →
            </button>
        </div>

        <p class="text-slate-500 text-center text-[10px] font-bold mt-8 leading-relaxed uppercase tracking-tighter">
            Mutari Team Intelligence Engine <br/> Configuración de cuenta empresarial
        </p>
    </div>
</div>

<script>
const API_URL = "http://localhost:8080";
const token = localStorage.getItem("token");

// ✅ VERIFICACIÓN DE SEGURIDAD
if (!token) {
    window.location.href = "/app/login.html";
}

async function createCompany() {
    const name = document.getElementById("company_name").value;
    const website = document.getElementById("company_website").value;
    const errorDiv = document.getElementById("error");
    const btn = document.getElementById("finish-btn");
    
    errorDiv.classList.add('hidden');

    if (!name) {
        showError("El nombre de la empresa es obligatorio.");
        return;
    }

    // UI Loading state
    btn.disabled = true;
    btn.innerText = "CONFIGURANDO...";

    try {
        const res = await fetch(`${API_URL}/companies`, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token 
            },
            body: JSON.stringify({ name, website })
        });

        const data = await res.json();

        if (res.ok) {
            if (data.token) {
                localStorage.setItem("token", data.token);
            }
            if (data.company && data.company.id) {
                localStorage.setItem("company_id", data.company.id);
            }
            window.location.href = "/app/company-hub.html?onboarding=1"; 
        } else {
            showError(data.error || "Error al crear la empresa.");
            
            if (res.status === 401) {
                localStorage.removeItem("token");
                setTimeout(() => window.location.href = "/app/login.html", 2000);
            }
        }
    } catch (err) {
        showError("Error de conexión con el servidor.");
    } finally {
        btn.disabled = false;
        btn.innerText = "FINALIZAR CONFIGURACIÓN →";
    }
}

function showError(msg) {
    const errorDiv = document.getElementById('error');
    errorDiv.innerText = msg;
    errorDiv.classList.remove('hidden');
}
</script>

</body>
</html>
