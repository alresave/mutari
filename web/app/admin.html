<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020617">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Mutari — Administración</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/app/supabase-config.js"></script>
  <script src="/app/supabase.js"></script>
  <script src="/pwa.js" defer></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto max-w-6xl p-6 md:p-10">
    <header class="mb-8 flex items-center justify-between border-b border-slate-800 pb-5">
      <div><h1 class="text-2xl font-bold">Administración de talento</h1><p class="mt-1 text-sm text-slate-400">Invita, incorpora y asigna candidatos a equipos.</p></div>
      <a href="/app/dashboard.html" class="rounded-lg bg-slate-800 px-4 py-2 text-sm font-semibold hover:bg-slate-700">Dashboard</a>
    </header>
    <p id="notice" class="mb-6 hidden rounded-lg p-3 text-sm"></p>
    <div class="grid gap-6 md:grid-cols-2">
      <section class="rounded-xl border border-slate-800 bg-slate-900 p-5"><h2 class="font-semibold">Crear empresa</h2><form id="companyForm" class="mt-4 space-y-3"><input name="name" required placeholder="Nombre" class="w-full rounded bg-slate-800 p-3"><input name="website" placeholder="Sitio web" class="w-full rounded bg-slate-800 p-3"><button class="rounded bg-indigo-600 px-4 py-2 font-semibold">Crear empresa</button></form></section>
      <section class="rounded-xl border border-slate-800 bg-slate-900 p-5"><h2 class="font-semibold">Crear equipo</h2><form id="teamForm" class="mt-4 space-y-3"><input name="name" required placeholder="Nombre del equipo" class="w-full rounded bg-slate-800 p-3"><input name="description" placeholder="Descripción" class="w-full rounded bg-slate-800 p-3"><button class="rounded bg-indigo-600 px-4 py-2 font-semibold">Crear equipo</button></form></section>
      <section class="rounded-xl border border-slate-800 bg-slate-900 p-5"><h2 class="font-semibold">Invitar candidato</h2><form id="inviteForm" class="mt-4 space-y-3"><input name="email" type="email" placeholder="Correo (opcional)" class="w-full rounded bg-slate-800 p-3"><button class="rounded bg-emerald-600 px-4 py-2 font-semibold">Generar invitación</button></form><p id="inviteCode" class="mt-3 break-all text-sm text-emerald-300"></p></section>
      <section class="rounded-xl border border-slate-800 bg-slate-900 p-5"><h2 class="font-semibold">Aceptar invitación</h2><form id="acceptForm" class="mt-4 space-y-3"><input name="code" required placeholder="Código de invitación" class="w-full rounded bg-slate-800 p-3"><button class="rounded bg-emerald-600 px-4 py-2 font-semibold">Unirme a empresa</button></form></section>
    </div>
    <section class="mt-6 rounded-xl border border-slate-800 bg-slate-900 p-5"><div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="font-semibold">Candidatos de la empresa</h2><p class="text-sm text-slate-400">Completa el cuestionario MCP antes de asignar un candidato.</p></div><div class="flex gap-2"><input id="teamId" type="number" min="1" placeholder="ID de equipo" class="w-32 rounded bg-slate-800 p-2 text-sm"><button id="refresh" class="rounded bg-slate-800 px-3 py-2 text-sm font-semibold">Actualizar</button></div></div><div id="candidates" class="mt-4 space-y-2"></div></section>
    <section class="mt-6 rounded-xl border border-slate-800 bg-slate-900 p-5"><h2 class="font-semibold">Miembros del equipo</h2><div id="members" class="mt-4 space-y-2 text-sm text-slate-300"></div></section>
  </main>
<script>
const notice = document.getElementById('notice');
function message(text, error = false) { notice.textContent = text; notice.className = `mb-6 rounded-lg p-3 text-sm ${error ? 'bg-red-950 text-red-200' : 'bg-emerald-950 text-emerald-200'}`; }
async function admin(action, payload = {}) { const response = await Mutari.admin({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, ...payload }) }); const body = await response.json(); if (!response.ok) throw new Error(body.error || 'Operation failed'); return body.data; }
async function refresh() { try { const candidates = await admin('list_candidates'); document.getElementById('candidates').innerHTML = candidates.map(c => `<div class="flex items-center justify-between rounded bg-slate-800 p-3"><span>${c.name || c.user_id} ${c.profile_complete ? '<em class="text-emerald-300">MCP listo</em>' : '<em class="text-amber-300">MCP pendiente</em>'}</span><button class="rounded bg-indigo-600 px-3 py-1 text-sm" onclick="addMember('${c.user_id}')">Agregar</button></div>`).join('') || '<p class="text-slate-400">Aún no hay candidatos incorporados.</p>'; const teamId = document.getElementById('teamId').value; if (teamId) { const members = await admin('list_team_members', { team_id: Number(teamId) }); document.getElementById('members').innerHTML = members.map(m => `<div class="rounded bg-slate-800 p-3">${m.name} · ${m.member_role} · ${m.profile_complete ? 'MCP listo' : 'MCP pendiente'}</div>`).join('') || 'El equipo no tiene miembros.'; } } catch (error) { message(error.message, true); } }
async function addMember(user_id) { const team_id = Number(document.getElementById('teamId').value); if (!team_id) return message('Indica el ID del equipo.', true); try { await admin('add_member', { team_id, user_id }); message('Miembro agregado.'); refresh(); } catch (error) { message(error.message, true); } }
document.getElementById('companyForm').onsubmit = async event => { event.preventDefault(); const form = new FormData(event.target); try { const id = await admin('create_company', { name: form.get('name'), website: form.get('website') }); message(`Empresa creada (ID ${id}).`); } catch (error) { message(error.message, true); } };
document.getElementById('teamForm').onsubmit = async event => { event.preventDefault(); const form = new FormData(event.target); try { const id = await admin('create_team', { name: form.get('name'), description: form.get('description') }); message(`Equipo creado (ID ${id}).`); document.getElementById('teamId').value = id; refresh(); } catch (error) { message(error.message, true); } };
document.getElementById('inviteForm').onsubmit = async event => { event.preventDefault(); try { const result = await admin('create_invite', { email: new FormData(event.target).get('email') }); document.getElementById('inviteCode').textContent = `Código: ${result.invite_code}`; message('Invitación creada. Comparte el código con la persona invitada.'); } catch (error) { message(error.message, true); } };
document.getElementById('acceptForm').onsubmit = async event => { event.preventDefault(); try { await admin('accept_invite', { invite_code: new FormData(event.target).get('code') }); message('Te uniste a la empresa. Completa el cuestionario MCP para ser candidato.'); } catch (error) { message(error.message, true); } };
document.getElementById('refresh').onclick = refresh;
Mutari.session().then(session => { if (!session) window.location = '/app/login.html'; else refresh(); });
</script>
</body>
</html>
