<!DOCTYPE html>
<html class="dark">
<head>

<meta charset="UTF-8">
<title>Mutari — Candidates</title>

<link rel="stylesheet" href="./styles/output.css">

</head>

<body class="bg-slate-950 text-slate-200">

<div class="max-w-4xl mx-auto py-12 px-6">

  <!-- HEADER -->
  <div class="flex justify-between items-center mb-8">
    <h1 class="text-2xl font-bold">Candidates</h1>
  </div>

  <!-- CREATE -->
  <div class="bg-slate-900 p-4 rounded-lg mb-8">

    <h2 class="text-sm mb-3 text-slate-400">Add Candidate</h2>

    <div class="flex gap-2">
      <input id="name" placeholder="Name"
        class="bg-slate-800 px-3 py-2 rounded w-full">

      <input id="email" placeholder="Email"
        class="bg-slate-800 px-3 py-2 rounded w-full">

      <button id="createBtn"
        class="bg-indigo-600 px-4 py-2 rounded">
        Add
      </button>
    </div>

  </div>

  <!-- LIST -->
  <div id="list" class="space-y-3"></div>

</div>

<script src="./candidates.js"></script>

</body>
</html>
