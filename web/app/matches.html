<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mutari Matches</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-900 text-white min-h-screen">

<div class="max-w-2xl mx-auto p-6">

<div class="flex items-center justify-between mb-6">

<h1 class="text-3xl font-bold">
Your Top Matches
</h1>

<button
onclick="logout()"
class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg"
>
Logout
</button>

</div>

<div id="matches" class="space-y-4"></div>

</div>

<script src="/app/supabase-config.js"></script>
<script src="/app/supabase.js"></script>
<script>

async function loadMatches(){

const res = await Mutari.mcp("/matches")

if(res.status === 401){
window.location="/app/login.html"
return
}

const data = await res.json()

renderMatches(data.matches)

}

function renderMatches(matches){

const container = document.getElementById("matches")

container.innerHTML=""

matches.forEach(m => {

const photo = m.photo || "https://api.dicebear.com/7.x/initials/svg?seed="+m.name

const card = document.createElement("div")

card.className="bg-gray-800 rounded-xl p-4 shadow-lg flex gap-4"

card.innerHTML = `

<img src="${photo}" class="w-16 h-16 rounded-full object-cover">

<div class="flex-1">

<div class="flex justify-between items-center">

<h3 class="text-lg font-bold">
${m.name || "User "+m.user_id}
</h3>

<span class="bg-green-500 text-black px-2 py-1 rounded text-sm font-bold">
${m.score}%
</span>

</div>

<div class="text-sm text-indigo-400 mt-1">
${m.compatibility_type}
</div>

<div class="text-xs text-gray-400 mt-2">
Best Alignment: ${m.top_block}
</div>

<div class="text-xs text-gray-400">
Secondary: ${m.secondary_alignment}
</div>

<div class="text-xs text-yellow-400 mt-2">
⚠ ${m.potential_friction}
</div>

<div class="text-xs text-green-400 mt-1">
Stability: ${m.relationship_stability}
</div>

</div>

`

container.appendChild(card)

})

}

function logout(){
Mutari.client().then(client => client.auth.signOut()).finally(() => {
window.location="/app/login.html"
})

}

window.onload = async () => {
if (!await Mutari.session()) { window.location="/app/login.html"; return }
loadMatches()
}

</script>

</body>
</html>
