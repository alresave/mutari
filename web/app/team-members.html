<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Equipo — Mutari</title>
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:8080; img-src 'self' data: https://i.pravatar.cc;">
    
    <link rel="stylesheet" href="styles/output.css">
    <link rel="stylesheet" href="styles/site.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="page-team-members text-slate-200 font-sans antialiased overflow-x-hidden">

<div class="max-w-[90rem] mx-auto p-6 md:p-10 animate-fade-in">

    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-10 pb-6 border-b border-slate-800/50">
        <div class="flex items-center gap-4">
            <svg width="40" height="32" viewBox="0 0 40 32" fill="none"><defs><linearGradient id="mutari-gradient" x1="0" y1="0" x2="40" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#818CF8"/><stop offset="1" stop-color="#C084FC"/></linearGradient></defs><path d="M0 32V8L12 20L20 12L28 20L40 8V32H32V18L28 22L20 14L12 22L8 18V32H0Z" fill="url(#mutari-gradient)"/><path d="M20 0L12 8L20 16L28 8L20 0Z" fill="#818CF8"/></svg>
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Gestión de Equipo</h1>
                <p class="text-xs text-slate-400 font-medium tracking-wide uppercase">Populate & Refine <span id="headerTeamName" class="text-indigo-400 font-semibold">—</span></p>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-3 ml-auto">
            <input type="text" id="searchInput" placeholder="Buscar por nombre o email..." 
                class="bg-slate-900 border border-slate-700 text-sm text-white px-4 py-2 rounded-xl focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors cursor-text">
            
            <button onclick="finishOnboarding()" 
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-xl text-sm font-bold shadow-lg active:scale-95 transition-all flex items-center gap-1.5">
                Ver Dashboard Principal →
            </button>
        </div>
    </header>

    <div class="flex flex-col lg:flex-row gap-8">
        
        <section class="glass-card p-6 flex-1 space-y-6">
            <div class="flex justify-between items-center pb-4 border-b border-slate-800">
                <div class="text-lg font-semibold text-white flex items-center gap-3">
                    <span class="text-xl">👥</span> Talent Pool de la Empresa
                </div>
                <div class="text-xs font-mono text-slate-500">Available to join</div>
            </div>
            
            <div id="companyError" class="text-red-400 text-xs font-medium text-center min-h-[1rem]"></div>

            <div id="companyTalentList" class="member-list space-y-2 max-h-[700px] overflow-y-auto pr-2">
                </div>
        </section>

        <section class="glass-card p-6 w-full lg:w-96 flex-shrink-0 space-y-6 border border-indigo-500/20 glow-indigo">
            <div class="flex justify-between items-center pb-4 border-b border-slate-800">
                <div class="text-lg font-semibold text-white flex items-center gap-3">
                    <span class="text-xl">🛡️</span> Roster del Equipo
                </div>
                <div class="text-xs font-mono text-indigo-400">Current Members</div>
            </div>

            <div id="teamError" class="text-red-400 text-xs font-medium text-center min-h-[1rem]"></div>

            <div id="teamRosterList" class="member-list space-y-2 max-h-[700px] overflow-y-auto pr-2">
                </div>
        </section>

    </div>

    <footer class="mt-16 pt-8 border-t border-slate-800/50 text-center text-xs text-slate-700">&copy; 2024 Mutari. Proprietary Team Intelligence.</footer>

</div>

<script>
/* ==========================================================
   🛠️ LÓGICA DE CONEXIÓN & GESTIÓN DE EQUIPOS (Funcional)
   ========================================================== */
const API_URL = "http://localhost:8080";
const token = localStorage.getItem("token");
// IDs de la Empresa y Equipo guardados en pasos anteriores
const companyId = localStorage.getItem("company_id"); // Asegúrate de guardar esto en create-company.html
const teamId = localStorage.getItem("current_team_id");

if (!token || !companyId || !teamId) {
    // Seguridad: Redirigir a login o al paso anterior si falta algún ID
    console.error("[Mutari Error] Faltan IDs de autenticación o contexto.");
    window.location.href = "login.html";
}

const headers = { 
    "Content-Type": "application/json",
    "Authorization": "Bearer " + token 
};

// Estado Global de datos (Miembros de empresa vs miembros de equipo)
let allCompanyMembers = [];
let currentTeamMembers = [];

const searchInput = document.getElementById("searchInput");

/* --- ✅ UTILS DE UI --- */

function getBadge(role) {
    const base = "text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wider";
    switch (role) {
        case "engineer": return `<span class="${base} bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">Engineer</span>`;
        case "product_manager": return `<span class="${base} bg-purple-500/10 text-purple-300 border border-purple-500/20">PM</span>`;
        default: return `<span class="${base} bg-slate-800 text-slate-400 border border-slate-700">${role || 'member'}</span>`;
    }
}

function handleFetchError(err, containerId) {
    console.error(`[Mutari Error] fetchApi ${containerId}:`, err);
    document.getElementById(containerId).innerText = err.message || "Connection Error.";
}

/* --- ✅ INICIALIZACIÓN --- */
async function init() {
    console.log("[Mutari Hub] Iniciando gestión de equipos...");
    await fetchTeamName();
    await Promise.all([
        fetchAllCompanyMembers(),
        fetchCurrentTeamMembers()
    ]);
    // Lógica para filtrar y renderizar las dos columnas
    updateLists();
    
    // Configurar buscador
    searchInput.addEventListener('input', updateLists);
}

/* --- ✅ API CALLS (Originales/Restauradas) --- */

async function fetchApi(endpoint, method = 'GET', body = null) {
    const res = await fetch(`${API_URL}${endpoint}`, { method, headers, ...(body && { body: JSON.stringify(body) }) });
    
    if (res.status === 401) { window.location.href = "login.html"; return; } // Auth expired

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
}

async function fetchTeamName() {
    try {
        const data = await fetchApi(`/teams/${teamId}`); // Endpoint original tuyo
        document.getElementById("headerTeamName").innerText = data.name || "Team Hub";
    } catch (err) { console.error("Error cargando nombre del equipo:", err); }
}

async function fetchAllCompanyMembers() {
    try {
        const data = await fetchApi(`/companies/${companyId}/members`); // Endpoint hipotético
        allCompanyMembers = Array.isArray(data) ? data : data.members || [];
    } catch (err) { handleFetchError(err, "companyError"); }
}

async function fetchCurrentTeamMembers() {
    try {
        const data = await fetchApi(`/teams/${teamId}/members`); // Endpoint original tuyo
        currentTeamMembers = Array.isArray(data) ? data : data.members || [];
    } catch (err) { handleFetchError(err, "teamError"); }
}

/* --- ✅ LÓGICA DE GESTIÓN DE MIEMBROS (El corazón de la interfaz) --- */

async function updateLists() {
    const searchTerm = searchInput.value.toLowerCase();
    
    // Crear un set de emails de los miembros actuales para filtrar rápidamente
    const teamEmailsSet = new Set(currentTeamMembers.map(m => m.email));
    
    // 1. Filtrar Miembros de la Piscina de Talento
    const talentPoolData = allCompanyMembers.filter(member => {
        // No está en el equipo Y coincide con la búsqueda (si hay búsqueda)
        const isNotTeamMember = !teamEmailsSet.has(member.email);
        const matchesSearch = searchTerm ? (
            member.name.toLowerCase().includes(searchTerm) || 
            member.email.toLowerCase().includes(searchTerm)
        ) : true;
        
        return isNotTeamMember && matchesSearch;
    });

    // 2. Filtrar Miembros del Roster del Equipo
    const rosterData = currentTeamMembers.filter(member => {
        const matchesSearch = searchTerm ? (
            member.name.toLowerCase().includes(searchTerm) || 
            member.email.toLowerCase().includes(searchTerm)
        ) : true;
        return matchesSearch;
    });

    // 3. Renderizar las listas actualizadas
    renderTalentPool(talentPoolData);
    renderTeamRoster(rosterData);
}

function renderTalentPool(members) {
    const container = document.getElementById("companyTalentList");
    container.innerHTML = "";
    
    if (members.length === 0) {
        container.innerHTML = `<p class="text-sm text-slate-600 italic py-6 text-center">No available talent found.</p>`;
        return;
    }

    members.forEach(member => {
        const li = document.createElement("div");
        li.className = "member-item flex justify-between items-center p-3 rounded-lg";
        
        li.innerHTML = `
            <div class="flex items-center gap-3">
                <img src="${member.photo || 'https://i.pravatar.cc/32?u=' + member.email}" class="w-8 h-8 rounded-full border-2 border-slate-700">
                <div>
                    <div class="font-semibold text-white leading-tight">${member.name || "Member"}</div>
                    <div class="text-xs text-slate-500 font-mono">${member.email}</div>
                </div>
                ${getBadge(member.role)}
            </div>
            
            <button onclick="addMemberToTeam('${member.name}', '${member.email}', '${member.role}')" 
                class="px-4 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 font-bold transition-all active:scale-95 flex items-center gap-1.5">
                Añadir al Equipo →
            </button>
        `;
        container.appendChild(li);
    });
}

function renderTeamRoster(members) {
    const container = document.getElementById("teamRosterList");
    container.innerHTML = "";
    
    if (members.length === 0) {
        container.innerHTML = `<p class="text-sm text-slate-700 italic py-6 text-center">Roster is empty. Add members.</p>`;
        return;
    }

    members.forEach(member => {
        const li = document.createElement("div");
        li.className = "member-item team-member flex justify-between items-center p-3 rounded-lg";
        
        li.innerHTML = `
            <div class="flex items-center gap-3 overflow-hidden">
                <img src="${member.photo || 'https://i.pravatar.cc/32?u=' + member.email}" class="w-8 h-8 rounded-full border-2 border-indigo-900 flex-shrink-0">
                <div class="overflow-hidden">
                    <div class="font-semibold text-white leading-tight truncate">${member.name || "Member"}</div>
                    <div class="text-[11px] text-slate-500 font-mono truncate">${member.email}</div>
                </div>
            </div>
            
            <button onclick="removeMemberFromTeam('${member.email}')" 
                class="px-3 py-1.5 rounded-lg bg-red-950/30 hover:bg-red-950/70 border border-red-900/50 text-xs text-red-300 transition-all active:scale-95">
                ← Quitar
            </button>
        `;
        container.appendChild(li);
    });
}

/* --- ✅ LÓGICA DE ACCIONES (Añadir/Quitar) --- */

async function addMemberToTeam(name, email, role) {
    // Resetear errores anteriores
    document.getElementById("teamError").innerText = "";

    try {
        // ✅ PETICIÓN POST A LOCALHOST:8080/TEAMS/{ID}/MEMBERS
        // Usamos tu modelo exacto requerido: {name, email, role}
        await fetchApi(`/teams/${teamId}/members`, 'POST', { 
            name, 
            email, 
            role: role || "member" // Rol por defecto
        });

        // Actualizar estado local y UI
        // En lugar de llamar a la API de nuevo, simulamos el cambio local para mejor performance
        const member = allCompanyMembers.find(m => m.email === email);
        if(member){
            currentTeamMembers.push(member);
            // No quitamos de allCompanyMembers, solo usamos el filtro para ocultar
            updateLists();
        }

    } catch (err) {
        handleFetchError(err, "teamError");
    }
}

async function removeMemberFromTeam(email) {
    // Resetear errores anteriores
    document.getElementById("teamError").innerText = "";

    try {
        // ✅ PETICIÓN DELETE A LOCALHOST:8080/TEAMS/{ID}/MEMBERS/{EMAIL} (Hipotético, o POST /teams/{id}/members/remove)
        await fetchApi(`/teams/${teamId}/members/${email}`, 'DELETE'); 

        // Actualizar estado local y UI
        currentTeamMembers = currentTeamMembers.filter(m => m.email !== email);
        updateLists();

    } catch (err) {
        handleFetchError(err, "teamError");
    }
}

function finishOnboarding() {
    // ✅ FIN DEL FLUJO. Limpiar contexto temporal de onboarding
    localStorage.removeItem("current_team_id");
    localStorage.setItem("profile_complete", "true"); 
    // Redirigir al dashboard principal de la aplicación
    window.location.href = "/app/index.html"; 
}

/* --- ✅ INICIAR MANUALMENTE --- */
init();

</script>
</body>
</html>
