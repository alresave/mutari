
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mutari HR Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
background: radial-gradient(circle at top,#0f172a,#020617);
}
.card {
background: rgba(15,23,42,0.75);
backdrop-filter: blur(8px);
border:1px solid rgba(255,255,255,0.05);
}
</style>
</head>

<body class="text-white font-sans">

<div class="max-w-7xl mx-auto p-6">

<div class="flex items-center gap-6 mb-8">
<img src="../images/logo.jpg" style="width:256px">
<div>
<h1 class="text-3xl font-bold">Mutari Team Intelligence</h1>
<p class="text-slate-400">AI-powered team composition analysis</p>
</div>
</div>

<div class="grid grid-cols-3 gap-6">

<!-- TEAM INFO -->
<div class="card rounded-xl p-6">

<h2 class="text-xl font-semibold mb-4">Team Info</h2>

<select id="teamSelect" class="w-full bg-slate-900 p-2 rounded mb-4"></select>

<div class="text-sm text-slate-400">Team Score</div>
<div id="teamScore" class="text-4xl font-bold mb-4">--</div>

<div class="text-sm text-slate-400 mb-1">Team Archetype</div>
<div id="teamArchetype" class="text-lg mb-4">--</div>

<button onclick="loadTeamGaps()" class="bg-indigo-600 px-4 py-2 rounded w-full">
Analyze Gaps
</button>

</div>

<!-- RADAR -->
<div class="card rounded-xl p-6">

<h2 class="text-xl font-semibold mb-4">Team Genome</h2>

<canvas id="radar"></canvas>

</div>

<!-- CANDIDATES -->
<div class="card rounded-xl p-6">

<h2 class="text-xl font-semibold mb-4">Candidates</h2>

<div id="candidateList" class="space-y-4 max-h-[500px] overflow-y-auto"></div>

</div>

</div>

<!-- TEAM GAPS -->
<div class="card rounded-xl p-6 mt-6">

<h2 class="text-xl font-semibold mb-4">Team Gaps</h2>

<div id="teamGaps"></div>

</div>

</div>

<script>

let teams = []
let selectedTeam = null

const demoTeams = [
{ id:1,name:"Core Platform Engineers"},
{ id:2,name:"Frontend Team"},
{ id:3,name:"Data Science Team"}
]

const demoCandidates = [
{ name:"Alice",score:91,role:"Visionary"},
{ name:"Mateo",score:84,role:"Specialist"},
{ name:"Emma",score:77,role:"Operator"},
{ name:"Lucas",score:69,role:"Builder"}
]

const demoBlocks = {
labels:[
"Ambition",
"Cognitive Style",
"Core Values",
"Emotional Stability",
"Growth",
"Intimacy",
"Lifestyle Rhythm",
"Relational Architecture"
],
values:[75,82,70,80,78,65,72,84]
}

const demoGaps = {
weak_blocks:["Emotional Stability","Lifestyle Rhythm"],
recommended_profile:"Visionary"
}

async function loadTeams(){

try{

const res = await fetch("/teams")
teams = await res.json()

}catch{

teams = demoTeams

}

const select = document.getElementById("teamSelect")

select.innerHTML=""

teams.forEach(t=>{

const opt=document.createElement("option")
opt.value=t.id
opt.innerText=t.name

select.appendChild(opt)

})

select.onchange = () => loadTeam(select.value)

loadTeam(teams[0].id)

}

async function loadTeam(teamId){

selectedTeam = teamId

document.getElementById("teamScore").innerText = Math.floor(70+Math.random()*20)

document.getElementById("teamArchetype").innerText = "Balanced Builders"

renderRadar(demoBlocks)

loadCandidates()

}

function renderRadar(data){

const ctx=document.getElementById("radar")

new Chart(ctx,{
type:"radar",
data:{
labels:data.labels,
datasets:[{
label:"Team Genome",
data:data.values,
borderColor:"#6366f1",
backgroundColor:"rgba(99,102,241,0.25)"
}]
},
options:{
scales:{
r:{
beginAtZero:true,
max:100,
grid:{color:"rgba(255,255,255,0.05)"},
pointLabels:{color:"#cbd5f5"},
ticks:{display:false}
}
}
}
})

}

function loadCandidates(){

const container=document.getElementById("candidateList")
container.innerHTML=""

demoCandidates.forEach(c=>{

const el=document.createElement("div")

el.className="bg-slate-900 p-4 rounded cursor-pointer"

el.innerHTML=`
<div class="flex justify-between">
<div>
<div class="font-semibold">${c.name}</div>
<div class="text-xs text-slate-400">${c.role}</div>
</div>
<div class="text-indigo-400 font-bold">${c.score}</div>
</div>
`

container.appendChild(el)

})

}

function loadTeamGaps(){

renderTeamGaps(demoGaps)

}

function renderTeamGaps(data){

const container=document.getElementById("teamGaps")
container.innerHTML=""

if(!data.weak_blocks || data.weak_blocks.length===0){

container.innerHTML="<div class='text-green-400'>No structural gaps detected</div>"
return

}

data.weak_blocks.forEach(block=>{

const el=document.createElement("div")

el.className="mb-3"

el.innerHTML=`
<div class="flex justify-between text-sm mb-1">
<span>${block}</span>
<span class="text-red-400">Weak</span>
</div>

<div class="w-full bg-slate-700 h-2 rounded">
<div class="bg-red-500 h-2 rounded w-3/4"></div>
</div>
`

container.appendChild(el)

})

if(data.recommended_profile){

const rec=document.createElement("div")

rec.className="mt-4 text-indigo-400"

rec.innerHTML="Recommended profile: <b>"+data.recommended_profile+"</b>"

container.appendChild(rec)

}

}

loadTeams()

</script>

</body>
</html>
