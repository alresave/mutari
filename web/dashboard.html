<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Mutari HR Intelligence</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-slate-100">

<div class="max-w-7xl mx-auto py-10 px-6">

<h1 class="text-3xl font-bold mb-8">
Mutari Team Intelligence
</h1>

<div class="grid grid-cols-3 gap-6">

<div class="col-span-2 bg-white p-6 rounded-xl shadow">

<h2 class="text-xl font-semibold mb-2">
Team Culture Profile
</h2>

<div class="text-sm text-slate-500 mb-4">
Archetype: <span id="archetype"></span>
</div>

<canvas id="teamRadar" style="max-height:350px;"></canvas>

</div>

<div class="bg-white p-6 rounded-xl shadow">

<h2 class="text-xl font-semibold mb-4">
Candidate Impact
</h2>

<div id="simulation">

<div class="text-sm text-slate-500">
Select a candidate to simulate team impact
</div>

</div>

</div>

</div>

<div class="mt-8 bg-white p-6 rounded-xl shadow">

<h2 class="text-xl font-semibold mb-4">
Candidate Evaluation
</h2>

<div
id="candidates"
class="max-h-96 overflow-y-auto space-y-3"
></div>

</div>

</div>

<script>

const token = localStorage.getItem("token")

const headers = {
"Authorization":"Bearer "+token
}

let teamRadar = null
let teamScores = null

async function loadTeamCulture(){

const res = await fetch("/teams/1/culture",{headers})
const data = await res.json()

document.getElementById("archetype").innerText = data.archetype

teamScores = data.block_scores

drawRadar(teamScores)

}

function drawRadar(scores, candidate=null){

const labels = Object.keys(scores)

const datasets = [
{
label:"Team Culture",
data:Object.values(scores)
}
]

if(candidate){
datasets.push({
label:"Candidate Profile",
data:Object.values(candidate)
})
}

const ctx = document.getElementById("teamRadar")

if(teamRadar){
teamRadar.destroy()
}

teamRadar = new Chart(ctx,{
type:"radar",
data:{
labels:labels,
datasets:datasets
},
options:{
plugins:{
legend:{position:"top"}
},
scales:{
r:{
min:0,
max:100
}
}
}
})

}

async function loadCandidates(){

const res = await fetch("/teams/1/matches",{headers})
const data = await res.json()

const container = document.getElementById("candidates")

container.innerHTML=""

const matches = data.matches.sort((a,b)=>b.score-a.score)

matches.forEach(match=>{

const photo = match.photo && match.photo !== ""
? match.photo
: "https://ui-avatars.com/api/?name="+encodeURIComponent(match.name)

const row = document.createElement("div")

row.className="candidate-row flex items-center justify-between border p-3 rounded-lg hover:bg-slate-50"

row.innerHTML = `

<div class="flex items-center gap-3">

<img
src="${photo}"
class="w-10 h-10 rounded-full"
/>

<div>

<div class="font-semibold">
${match.name}
</div>

<div class="text-sm text-slate-500">
Compatibility Score: ${match.score}%
</div>

</div>

</div>

<button class="simulate-btn bg-indigo-600 text-white px-3 py-1 rounded">
Simulate Impact
</button>

`

row.querySelector(".simulate-btn").addEventListener("click",()=>{

selectCandidate(row)

simulate(match)

})

container.appendChild(row)

})

}

function selectCandidate(row){

document.querySelectorAll(".candidate-row").forEach(r=>{
r.classList.remove("ring","ring-indigo-500")
})

row.classList.add("ring","ring-indigo-500")

}

function simulate(match){

document.getElementById("simulation").innerHTML = `

<div class="mb-3">

<div class="text-sm text-slate-500">
Team Compatibility Score
</div>

<div class="text-2xl font-bold">
${match.score}%
</div>

</div>

<div class="mb-3">

<div class="text-sm text-slate-500">
Suggested Role
</div>

<div class="font-semibold">
${match.role}
</div>

</div>

<div class="text-sm text-slate-600">
${match.compatibility_summary}
</div>

`

drawRadar(teamScores, match.block_scores)

}

loadTeamCulture()
loadCandidates()

</script>

</body>
</html>
