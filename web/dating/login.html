<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mutari Login</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center">

<div class="w-full max-w-md bg-gray-900 p-8 rounded-xl shadow-xl">

<h1 class="text-3xl font-bold text-center mb-6">Mutari</h1>

<p class="text-gray-400 text-center mb-8">
Compatibility Engine
</p>

<div class="space-y-4">

<input
id="name"
placeholder="Name (signup only)"
class="w-full p-3 rounded bg-gray-800 border border-gray-700"
/>

<input
id="email"
placeholder="Email"
class="w-full p-3 rounded bg-gray-800 border border-gray-700"
/>

<input
id="password"
type="password"
placeholder="Password"
class="w-full p-3 rounded bg-gray-800 border border-gray-700"
/>

<button
onclick="signup()"
class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-semibold"
>
Sign Up
</button>

<button
onclick="login()"
class="w-full bg-green-600 hover:bg-green-700 p-3 rounded font-semibold"
>
Login
</button>

</div>

<p id="error" class="text-red-400 mt-4 text-center"></p>

</div>

<script src="/app/supabase-config.js"></script>
<script src="/dating/supabase.js"></script>
<script>

async function signup() {

const name = document.getElementById("name").value
const email = document.getElementById("email").value
const password = document.getElementById("password").value

const { data, error } = await (await Mutari.client()).auth.signUp({ email, password, options: { data: { name } } })
if(error){ document.getElementById("error").innerText=error.message; return }
if(!data.session){ document.getElementById("error").innerText="Check your email to confirm your account, then sign in."; return }
window.location.href="/dating/index.html"

}

async function login(){

const email=document.getElementById("email").value
const password=document.getElementById("password").value

const { error } = await (await Mutari.client()).auth.signInWithPassword({ email, password })
if(error){ document.getElementById("error").innerText=error.message; return }
window.location.href="/dating/index.html"

}

</script>

</body>
</html>
