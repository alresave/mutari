<!DOCTYPE html>
<html class="dark">
<head>

<meta charset="UTF-8">
<title>Mutari Compatibility Profile</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
  darkMode: "class"
}
</script>

</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors">

<div class="max-w-4xl mx-auto py-12 px-6">

<div class="flex justify-between items-center mb-10">

<h1 class="text-4xl font-bold">
Mutari Compatibility Profile
</h1>

<button
onclick="toggleDark()"
class="bg-slate-200 dark:bg-slate-700 px-4 py-2 rounded-lg text-sm"
>
Toggle
</button>

</div>

<!-- TEST -->
<div id="testSection">

<form id="testForm" class="space-y-10"></form>

<div class="text-center mt-10">

<button
onclick="submitAnswers()"
class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-8 py-3 rounded-lg shadow"
>
Submit
</button>

</div>

</div>

<!-- MATCHES -->
<div id="matchesSection" class="hidden">

<h2 class="text-3xl font-bold mb-8 text-center">
Your Top Matches
</h2>

<div id="matchesContainer" class="grid md:grid-cols-2 gap-6"></div>

</div>

</div>

<script>

if(data.token){

localStorage.setItem("token",data.token)

window.location="/app/matches.html"

}

let questions = []

function toggleDark() {
  document.documentElement.classList.toggle("dark")
}

async function loadQuestions() {

  const res = await fetch("/mcp/questions")
  const data = await res.json()

  questions = data.questions

  const form = document.getElementById("testForm")

  let currentBlock = -1

  questions.forEach(q => {

    if (q.block !== currentBlock) {

      currentBlock = q.block

      const block = document.createElement("div")

      block.innerHTML = `
      <div class="text-2xl font-semibold border-b pb-2 border-slate-200 dark:border-slate-700">
      ${q.block_name}
      </div>
      `

      form.appendChild(block)

    }

    const container = document.createElement("div")

    container.className =
      "bg-white dark:bg-slate-800 p-6 rounded-xl shadow"

    container.innerHTML = `

    <div class="mb-4 font-medium">
      ${q.question}
    </div>

    <div class="flex justify-between text-sm text-slate-500 mb-2">
      <span>Strongly Disagree</span>
      <span>Strongly Agree</span>
    </div>

    <input
      type="range"
      min="0.1"
      max="1"
      step="0.1"
      value="0.5"
      id="q_${q.id}"
      class="w-full accent-indigo-600"
    >

    <div class="text-center mt-2 text-sm text-slate-500">
      Value: <span id="v_${q.id}">0.5</span>
    </div>

    `

    form.appendChild(container)

    const slider = container.querySelector(`#q_${q.id}`)
    const label = container.querySelector(`#v_${q.id}`)

    slider.addEventListener("input", () => {
      label.innerText = slider.value
    })

  })

}

async function submitAnswers() {

  const answers = []

  questions.forEach(q => {

    const slider = document.getElementById(`q_${q.id}`)

    answers.push({
      question_id: q.id,
      answer: parseFloat(slider.value)
    })

  })

  const userId = 1

  await fetch("/mcp/answers", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      user_id: userId,
      answers: answers
    })

  })

  loadMatches(userId)

}

async function loadMatches(userId) {

  const res = await fetch(`/matches/${userId}`)
  const data = await res.json()

  document.getElementById("testSection").classList.add("hidden")
  document.getElementById("matchesSection").classList.remove("hidden")

  const container = document.getElementById("matchesContainer")

  container.innerHTML = ""

  data.matches.forEach(m => {

    const card = document.createElement("div")

    card.className =
      "bg-white dark:bg-slate-800 p-6 rounded-xl shadow"

    card.innerHTML = `

    <div class="flex justify-between items-center mb-4">

      <div class="text-2xl font-bold">
        ${m.score}%
      </div>

      <div class="text-sm text-indigo-500">
        ${m.compatibility_type}
      </div>

    </div>

    <div class="mb-3">
      <div class="text-sm text-slate-500">
      Best Alignment
      </div>

      <div class="font-semibold">
      ${m.top_block}
      </div>
    </div>

    <div class="mb-3">
      <div class="text-sm text-slate-500">
      Relationship Stability
      </div>

      <div class="font-semibold">
      ${m.relationship_stability}
      </div>
    </div>

    <div class="text-sm text-slate-400">
      ⚠ ${m.potential_friction}
    </div>

    `

    container.appendChild(card)

  })

}

loadQuestions()

</script>

</body>
</html>
